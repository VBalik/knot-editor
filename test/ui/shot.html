<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="f"></iframe>
<script>
const q=new URLSearchParams(location.search); const f=document.getElementById('f'); f.src='/'+(q.get('f')||'index.html')+'?cb='+Math.random();
f.addEventListener('load',()=>{ const w=f.contentWindow; setTimeout(()=>{ try{
  w.__noWorkers=true; w.document.getElementById('randN').value='8'; let t=0; do{ w.document.getElementById('randKnot').onclick(); }while(w.eval('isUnknot') && t++<30);
  w.msWinsClear(); const vs=w.eval('verts'); w.msResultAdd(1,0.164,vs,''); w.msResultAdd(2,0.161,vs,''); w.msResultAdd(3,0.166,vs,''); w.msMarkBest();
  if(q.get('state')==='run'){ w.document.getElementById('play').classList.add('running'); w.document.getElementById('play').textContent='⏸ Pause'; w.document.getElementById('statusPill').classList.add('run'); w.setStatus('Min 0.164 · 39% · E 0.171 · try 2/5'); }
  else { w.document.getElementById('statusPill').classList.add('done'); w.setStatus('Min: 0.161 (1: 0.164, 2: 0.161, 3: 0.166) · 9.1 s parallel'); w.stirEnable(true); }
  document.title='READY';
}catch(e){ document.title='ERR '+e.message; } }, 1200); });
</script></body></html>
