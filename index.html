<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topological Knot Editor · 3D Relaxation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');

/* ============================================================
   VARIANT C — NEON LAB
   Deep-space ground, teal→violet accents, subtle neon glows.
   Layout skeleton and every functional rule are preserved.
   ============================================================ */
:root{
  --bg:#070a10; --bg2:#0b1019; --panel:#0f1521; --line:#182031; --txt:#e6edf7;
  --muted:#98a5ba; --accent:#3ee0d2; --accent2:#f5a623; --over:#4ade80; --under:#f87171;
  --teal:#3ee0d2; --violet:#8b7cff; --green:#4ade80; --red:#ff4d6d;
  --glow-teal:rgba(62,224,210,.45); --glow-violet:rgba(139,124,255,.45);
  --glow-green:rgba(74,222,128,.45); --glow-red:rgba(255,77,109,.5);
  --grad:linear-gradient(90deg,var(--teal),var(--violet));
  --edge:rgba(150,170,210,.14); --edge-hi:rgba(150,170,210,.28);
  --glass:rgba(12,17,27,.84);
  --r-stage:14px;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--txt);
  background:
    radial-gradient(900px 640px at 12% -8%, rgba(62,224,210,.07), transparent 62%),
    radial-gradient(820px 620px at 92% 108%, rgba(139,124,255,.09), transparent 62%),
    var(--bg);
  font:14px/1.4 var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
::selection{background:rgba(62,224,210,.28);color:#fff}

/* ---- panes: two floating "lab windows" on the space ground ---- */
#app{display:flex;height:100%}
.pane{display:flex;flex-direction:column;min-width:0;padding:8px;gap:8px}
#left{flex:0 0 var(--leftW,46%);min-width:240px}
#right{flex:1 1 auto;min-width:340px;position:relative}
#splitter{flex:0 0 7px;cursor:col-resize;position:relative;margin:8px 0;border-radius:4px;transition:background .15s;touch-action:none;user-select:none;-webkit-user-select:none}   /* граница панелей: тянуть мышью, двойной клик — 46 % */
#splitter::before{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--line)}
#splitter:hover,#splitter.drag{background:rgba(62,224,210,.16)}

.paneTitle{font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  color:#a3b3cb;flex:none;padding:0 4px 0 2px;user-select:none;-webkit-user-select:none;
  display:inline-flex;align-items:center;white-space:nowrap}
.paneTitle::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;flex:none;
  background:linear-gradient(135deg,var(--teal),var(--violet));
  box-shadow:0 0 8px var(--glow-teal)}
.paneTitle #appVer{font-weight:700;margin-left:6px;letter-spacing:.6px;color:#dfe7f3;-webkit-text-fill-color:#dfe7f3;background:none}   /* номер версии после «2D Editor»: сплошной цвет, вне градиентной маски */
@supports (-webkit-background-clip:text) or (background-clip:text){
  .paneTitle{background:linear-gradient(90deg,#7df3e8,#b3a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
}
.buildTag{font-size:14px;font-weight:600;color:#fff;letter-spacing:.4px;flex:none;white-space:nowrap;margin-left:auto;
  user-select:text;-webkit-user-select:text}

/* ---- floating toolbar: one 52px row, rounded ends, glass + hairline glow ---- */
.topbar{display:flex;align-items:center;gap:7px;row-gap:4px;flex-wrap:wrap;overflow:visible;flex:none;
  position:relative;min-height:52px;padding:6px 12px;   /* не помещается в строку — переносится, а не обрезается */
  background:linear-gradient(180deg,rgba(24,32,48,.9),rgba(12,17,27,.92));
  border:1px solid var(--edge);border-radius:999px;
  backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 14px 32px -18px rgba(0,0,0,.95), 0 0 34px -22px var(--glow-teal)}
.topbar::before{content:"";position:absolute;left:28px;right:28px;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(62,224,210,.5) 30%,rgba(139,124,255,.5) 70%,transparent)}
.tspacer{flex:1 1 6px}
/* 3D-панель: органы управления компактнее */
#right .topbar{gap:5px;padding:6px 9px}
#right .chip{padding:0 7px;gap:5px;font-size:11px}
#right .chip input[type=range]{width:44px}
#right .chip input[type=number]{width:42px}
#stressChip>span{width:30px!important}
#right button{padding:0 9px}

/* ---- chips ---- */
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;flex:none;
  background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:8px;
  font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;letter-spacing:.1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:border-color .18s,background .18s,box-shadow .18s}
.chip:hover{border-color:rgba(62,224,210,.35);background:rgba(62,224,210,.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 14px -5px var(--glow-teal)}
.chip:focus-within{border-color:rgba(62,224,210,.55);
  box-shadow:0 0 0 3px rgba(62,224,210,.12), 0 0 16px -4px var(--glow-teal)}
.chip b{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;min-width:18px;text-align:right;
  text-shadow:0 0 8px rgba(62,224,210,.35)}
.chip label{display:inline-flex;align-items:center;gap:6px}
.chip input[type=range]{width:54px;margin:0}
.chip input[type=number]{width:52px;height:24px;background:rgba(3,6,12,.55);color:var(--txt);
  border:1px solid var(--edge);border-radius:4px;padding:0 6px;font:inherit;font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;text-align:center;-moz-appearance:textfield;appearance:textfield;outline:none;
  transition:border-color .15s,box-shadow .15s}
.chip input[type=number]:focus{border-color:rgba(62,224,210,.6);box-shadow:0 0 0 2px rgba(62,224,210,.14), 0 0 10px -2px var(--glow-teal)}
.chip input[type=number]::-webkit-outer-spin-button,.chip input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chip button.ghost{height:24px;padding:0 8px;font-size:12px}
.chip select{height:24px;background:rgba(3,6,12,.55);color:var(--txt);border:1px solid var(--edge);border-radius:4px;padding:0 4px;font:inherit;font-size:12px;font-weight:600;outline:none;cursor:pointer}   /* режим Stir — в стиле числовых полей */
.chip select:focus{border-color:rgba(62,224,210,.6);box-shadow:0 0 0 2px rgba(62,224,210,.14)}

/* checkbox (Tight) — small neon tile */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:15px;height:15px;margin:0;flex:none;
  border-radius:3px;border:1px solid var(--edge-hi);background:rgba(3,6,12,.55);position:relative;cursor:pointer;
  vertical-align:-3px;transition:background .15s,border-color .15s,box-shadow .15s}
input[type=checkbox]:hover{border-color:rgba(62,224,210,.5)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--teal),var(--violet));border-color:transparent;
  box-shadow:0 0 10px -2px var(--glow-teal)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
  border:solid #06101a;border-width:0 2px 2px 0;transform:rotate(45deg)}
input[type=checkbox]:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(62,224,210,.22)}

/* segmented control */
.seg{display:inline-flex;height:32px;border:1px solid var(--edge);border-radius:8px;overflow:hidden;flex:none;
  background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.seg button{height:100%;border:none;border-left:1px solid var(--edge);border-radius:0;
  background:transparent;padding:0 11px;font-weight:600;font-size:12px;min-width:38px;justify-content:center;color:#aab6c8}
.seg button:first-child{border-left:none}
.seg button:hover{background:rgba(62,224,210,.1);color:var(--txt);box-shadow:none}
.hint{font-size:11.5px;color:#7d8a9d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:0 1 auto;min-width:0}

/* ---- status pill: bottom-left of the 3D stage ---- */
.statuspill{position:absolute;left:12px;bottom:12px;z-index:6;max-width:calc(100% - 24px);
  display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;
  background:rgba(9,13,21,.8);border:1px solid var(--edge-hi);border-radius:999px;
  font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 22px -8px rgba(0,0,0,.75);
  transition:border-color .25s,box-shadow .25s,color .2s}
.statuspill .dot{width:7px;height:7px;border-radius:50%;background:#5b6980;flex:none;transition:background .2s,box-shadow .2s}
.statuspill.run{color:var(--txt);border-color:rgba(245,166,35,.35);box-shadow:0 8px 22px -8px rgba(0,0,0,.75), 0 0 18px -6px rgba(245,166,35,.45)}
.statuspill.run .dot{background:var(--accent2);animation:pulse 1.1s infinite}
.statuspill.done{border-color:rgba(74,222,128,.32);box-shadow:0 8px 22px -8px rgba(0,0,0,.75), 0 0 18px -6px var(--glow-green)}
.statuspill.done .dot{background:var(--over);box-shadow:0 0 8px var(--glow-green)}   /* green dot — run finished */
.statuspill #status{overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,166,35,.5)}70%{box-shadow:0 0 0 6px rgba(245,166,35,0)}100%{box-shadow:0 0 0 0 rgba(245,166,35,0)}}

/* ---- narrow windows: toolbar stays a single row ---- */
@media (max-width:1240px){
  .pane{padding:6px;gap:6px}
  .topbar{gap:4px;padding:0 8px}
  .paneTitle{display:none} #editorTitle{display:inline-flex}   /* в узком окне остаётся только «2D Editor <версия>» */
  .chip{padding:0 7px;gap:5px}
  .chip input[type=range]{width:36px}
  #thickVal{}
  button.go{padding:0 9px}
  button.ghost{padding:0 6px}
}

/* ---- stages ---- */
.stagewrap{flex:1;position:relative;min-height:0}

/* result windows of the tries: mini views drawn on the shared canvas (scissor) beneath */
#msDock{position:absolute;inset:10px 10px 52px 10px;z-index:5;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;pointer-events:none;overflow:hidden}
#msDock.many .msWin{width:124px}
#msDock.many .msView{height:96px}
.msWin{pointer-events:auto;width:172px;border:1px solid var(--edge-hi);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
  background:transparent;box-shadow:0 8px 22px -10px rgba(0,0,0,.75)}
.msWin:hover{border-color:rgba(62,224,210,.45);box-shadow:0 0 18px -6px var(--glow-teal), 0 8px 22px -10px rgba(0,0,0,.75)}
.msHead{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 13px;font-size:11px;font-weight:500;color:var(--muted);
  background:linear-gradient(180deg,rgba(20,27,40,.94),rgba(11,16,25,.9));
  border-bottom:1px solid rgba(150,170,210,.1);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  user-select:none;-webkit-user-select:none}
.msHead .msTitle{font-weight:700;color:var(--txt);letter-spacing:.2px}
.msHead .msE{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.msHead .msClose{display:none;height:18px;min-width:18px;padding:0 4px;font-size:13px;line-height:1;border-radius:3px;background:transparent;
  border:1px solid var(--edge-hi);color:var(--muted);cursor:pointer;box-shadow:none}
.msHead .msClose:hover{color:var(--txt);border-color:rgba(62,224,210,.5);background:rgba(62,224,210,.08);box-shadow:none}
.msWin{position:relative;cursor:pointer;transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease,border-color .2s,box-shadow .2s}   /* клик — выбрать (попытка в главном виде); двойной клик по заголовку — раскрыть */
.msView{width:100%;height:138px;touch-action:none;background:transparent}
/* markers (3.3): one bold 3px contour ALONG THE WINDOW EDGE = the 1px border in the marker colour + a 2px ring (::before) just inside it.
   .shown — the try displayed in the main 3D view: light contour and white title (exactly one window or none);
   .best  — record try («Min»): green contour, greenish header, energy in bold green;
   both   — light contour outside, the same bold green contour directly inside it (::after, 3px). Rings are overlays: no layout change,
   they cover the header and the view; the header is 32px so the caption never touches the rings (3px single, 6px double). */
.msWin.best{border-color:var(--green);box-shadow:0 8px 22px -10px rgba(0,0,0,.75)}
.msWin.best::before{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;border:2px solid var(--green);z-index:2}
.msWin.best .msHead{background:linear-gradient(180deg,rgba(20,38,34,.94),rgba(11,20,20,.9));border-bottom-color:transparent}
.msWin.best .msHead .msTitle{color:var(--green);text-shadow:0 0 8px var(--glow-green)}
.msWin.best .msHead .msE{color:var(--green)}
.msWin.best .msHead .msE b{font-weight:700;text-shadow:0 0 8px var(--glow-green)}
.msWin.shown{border-color:rgba(236,243,255,.95);box-shadow:0 8px 22px -10px rgba(0,0,0,.75)}
.msWin.shown::before{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;border:2px solid rgba(236,243,255,.95);z-index:2}
.msWin.shown .msHead .msTitle{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.55)}
.msWin.shown.best{border-color:rgba(236,243,255,.95)}   /* оба признака: светлый контур по краю, зелёный такой же толщины сразу внутри него */
.msWin.shown.best::after{content:"";position:absolute;inset:2px;border-radius:7px;pointer-events:none;border:3px solid var(--green);z-index:2}
.msWin.max{z-index:8;cursor:default;border-color:rgba(62,224,210,.55);
  box-shadow:0 0 0 1px rgba(62,224,210,.25), 0 0 28px -6px var(--glow-teal), 0 18px 40px -16px rgba(0,0,0,.9)}
.msWin.max.best{border-color:var(--green);box-shadow:0 18px 40px -16px rgba(0,0,0,.9)}
.msWin.max.shown{border-color:rgba(236,243,255,.95);box-shadow:0 18px 40px -16px rgba(0,0,0,.9)}
.msWin.max .msView{height:auto;flex:1;cursor:grab}
.msWin.max .msView:active{cursor:grabbing}
.msWin.max .msClose{display:inline-block}
.msSpacer{width:172px;height:172px;visibility:hidden}

/* 2D canvas: dotted lab grid + faint teal/violet nebulae (canvas is cleared transparent, so this shows through) */
#draw{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;border-radius:var(--r-stage);
  background:
    radial-gradient(circle, rgba(170,190,230,.17) 1px, transparent 1.6px) 0 0/22px 22px,
    radial-gradient(1000px 640px at 22% 12%, rgba(62,224,210,.10) 0%, rgba(62,224,210,0) 60%),
    radial-gradient(880px 760px at 84% 94%, rgba(139,124,255,.13) 0%, rgba(139,124,255,0) 60%),
    var(--bg2)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:var(--r-stage);
  background:
    radial-gradient(1000px 640px at 24% 10%, rgba(62,224,210,.07) 0%, rgba(62,224,210,0) 60%),
    radial-gradient(880px 760px at 82% 96%, rgba(139,124,255,.10) 0%, rgba(139,124,255,0) 60%),
    var(--bg2)}

/* ---- buttons ---- */
button{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--edge);flex:none;
  height:32px;padding:0 12px;border-radius:8px;cursor:pointer;
  font-family:var(--font);font-size:12px;font-weight:600;line-height:1;letter-spacing:.2px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:background .13s,border-color .13s,transform .06s,filter .13s,box-shadow .18s,color .13s}
button:hover{background:rgba(255,255,255,.09);border-color:rgba(62,224,210,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 14px -5px var(--glow-teal)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(62,224,210,.25), 0 0 14px -5px var(--glow-teal)}
/* Physics: green at rest, red pulse while computing, blue in Stir mode (3.9: same look as Physics) */
button.go{background:linear-gradient(180deg,#63f2a5,#1fbd67);color:#03200f;
  border-color:rgba(74,222,128,.7);font-weight:700;letter-spacing:.3px;
  box-shadow:0 0 18px -4px var(--glow-green), inset 0 1px 0 rgba(255,255,255,.35)}
button.go:hover{filter:brightness(1.07);border-color:rgba(120,240,170,.9);
  box-shadow:0 0 22px -3px rgba(74,222,128,.5), inset 0 1px 0 rgba(255,255,255,.4)}
button.go.stir{background:linear-gradient(180deg,#6cc4ff,#2186f0);color:#021a33;border-color:rgba(80,170,255,.75);   /* 3.9: Stir — та же кнопка, что Physics, но синяя */
  box-shadow:0 0 18px -4px rgba(60,160,255,.45), inset 0 1px 0 rgba(255,255,255,.35)}
button.go.stir:hover{border-color:rgba(130,200,255,.9);box-shadow:0 0 22px -3px rgba(60,160,255,.5), inset 0 1px 0 rgba(255,255,255,.4)}
button.go.running{background:linear-gradient(180deg,#ff7590,#e01f4d);color:#fff;
  border-color:rgba(255,120,150,.8);
  box-shadow:0 0 16px -4px var(--glow-red), inset 0 1px 0 rgba(255,255,255,.25);
  animation:goPulse 1.2s ease-in-out infinite}
@keyframes goPulse{
  0%,100%{box-shadow:0 0 12px -4px rgba(255,77,109,.3), inset 0 1px 0 rgba(255,255,255,.25)}
  50%{box-shadow:0 0 24px -2px rgba(255,77,109,.5), inset 0 1px 0 rgba(255,255,255,.25)}
}
button.ghost{background:transparent;color:var(--muted);padding:0 9px;border-color:transparent;box-shadow:none}
button.ghost:hover{background:rgba(255,255,255,.06);color:var(--txt);border-color:var(--edge);box-shadow:none}
button:disabled{opacity:.4;cursor:not-allowed;filter:saturate(.5);box-shadow:none;animation:none}
button:disabled:hover{background:rgba(255,255,255,.05);border-color:var(--edge)}

/* ---- sliders & colour: glowing thumbs on a teal→violet track ---- */
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:linear-gradient(90deg,rgba(62,224,210,.55),rgba(139,124,255,.55));
  outline:none;cursor:pointer;accent-color:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffffff 0%,var(--accent) 55%,#22b8ab 100%);border:2px solid #070a10;
  box-shadow:0 0 0 1px rgba(62,224,210,.45), 0 0 9px rgba(62,224,210,.5);
  transition:transform .1s,box-shadow .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18);box-shadow:0 0 0 1px rgba(62,224,210,.5), 0 0 12px rgba(62,224,210,.5)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ffffff 0%,var(--accent) 55%,#22b8ab 100%);border:2px solid #070a10;
  box-shadow:0 0 0 1px rgba(62,224,210,.45), 0 0 9px rgba(62,224,210,.5)}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:linear-gradient(90deg,rgba(62,224,210,.55),rgba(139,124,255,.55))}
input[type=range]:focus-visible{box-shadow:0 0 0 3px rgba(62,224,210,.2)}
input[type=color]{-webkit-appearance:none;appearance:none;width:22px;height:22px;padding:0;margin:0;
  border:none;border-radius:50%;background:none;cursor:pointer;
  box-shadow:0 0 0 2px var(--edge-hi)}
input[type=color]:hover{box-shadow:0 0 0 2px rgba(62,224,210,.5), 0 0 10px -1px var(--glow-teal)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
input[type=color]::-moz-color-swatch{border:none;border-radius:50%}

/* soft vignette + rounded frame over each stage (does not catch the mouse) */
.vignette{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:var(--r-stage);
  border:1px solid rgba(150,170,210,.13);
  background:radial-gradient(135% 105% at 50% 42%, transparent 58%, rgba(2,4,9,.5) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02), inset 0 0 70px -40px rgba(62,224,210,.18), 0 10px 30px -18px rgba(0,0,0,.9)}

#left.imgDrop .stagewrap{outline:2px dashed rgba(62,224,210,.65);outline-offset:-8px;border-radius:var(--r-stage)}   /* 3.4: сюда можно бросить картинку узла */
/* 4.2: пока файл тащат над полем 2D — надпись поверх холста, чтобы было видно, куда бросать */
.dropHint{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;pointer-events:none;
  font-weight:600;font-size:15px;letter-spacing:.4px;color:#cdf3ee;text-shadow:0 2px 12px rgba(0,0,0,.75);
  background:radial-gradient(120% 90% at 50% 50%, rgba(62,224,210,.12), transparent 72%);border-radius:var(--r-stage)}
#left.imgDrop .dropHint{display:flex}
/* UI 2.01: left only Random/Clear, right without legend/OBJ/Telem */
#restoreLast,#presets,#buildTag,#crossInfo,#knotType,#hint,#stressChip,#exportObj,#exportTelem{display:none !important}

</head>
<body>
<div id="app">
  <!-- ================= LEFT: 2D drawing ================= -->
  <div id="left" class="pane">
    <div class="topbar">
      <span class="paneTitle" id="editorTitle" style="text-transform:none">2D Editor <span id="appVer">4.6</span></span>
      <button id="restoreLast" title="Restore the last drawing from telemetry">Last</button><button id="clear" class="ghost">Clear</button>
      <span class="seg" id="presets" title="Example knots">
        <button class="ex" data-knot="trefoil" title="Trefoil 3₁">3₁</button>
        <button class="ex" data-knot="figure8" title="Figure-eight 4₁">4₁</button>
        <button class="ex" data-knot="cinquefoil" title="Cinquefoil 5₁">5₁</button>
        <button class="ex" data-knot="septafoil" title="Septafoil 7₁">7₁</button>
      </span>
      <span class="chip" title="Random diagram with the given number of crossings (over/under chosen at random); crossings are kept at least 1.5 marker radii apart"><button id="randKnot" class="ghost">Random</button><input id="randN" type="number" min="1" max="250" value="20" title="number of crossings, 1–250"></span>
      <button id="imgLoad" class="ghost" title="Load a knot from a picture or sketch (PNG, JPEG…): strands with a gap at each under-crossing; crossings drawn without a gap get alternating over/under. You can also drag a picture straight onto the 2D field, or paste it (⌘V / Ctrl+V)">Upload</button><input id="imgFile" type="file" accept="image/*" hidden>
      <span class="buildTag" id="buildTag" title="Build version"></span>
      <span class="chip" id="crossInfo" title="Number of diagram crossings">×<b>0</b></span>
      <span class="chip" id="knotType" title="Diagram determinant: 1 — unknot (will straighten into a circle)">type <b>—</b></span>
      <span class="chip" title="Rigidity of the rope while you drag it by hand, 1–10: the higher, the wider and smoother the bend; at 1 the rope gives way right under your hand">Rigid. <input type="range" id="dragStiff" min="1" max="10" step="1" value="7"><b id="dragStiffVal">7</b></span>
      <span class="tspacer"></span>
      <span class="hint" id="hint">Drag the mouse and return to the start · click a crossing to flip over/under</span>
    </div>
    <div class="stagewrap" id="stage2d">
      <canvas id="draw"></canvas>
      <div class="dropHint" id="dropHint">Drop a picture of a knot here</div>
      <div class="vignette"></div>
    </div>
  </div>
  <div id="splitter" title="Drag to resize the panes · double-click to reset"></div>

  <!-- ================= RIGHT: 3D view ================= -->
  <div id="right" class="pane">
    <div class="topbar">
      <span class="paneTitle">3D View</span>
      <span class="chip" id="stressChip" title="Stress coloring: green — relaxed (ring curvature), red — strong bending">stress&nbsp;<span style="display:inline-block;width:44px;height:9px;border-radius:5px;vertical-align:-1px;background:linear-gradient(90deg,#2ec861,#d9cb32,#e0452e)"></span></span>
      <span class="chip" title="Wire thickness w, 1–10 (unit = 1/3000 of the wire length): physical tube diameter, same as on screen">Thick. <input type="range" id="thick" min="1" max="10" step="1" value="5"><b id="thickVal">5</b></span>
      <span class="chip" title="Straightening stiffness, 1–20: the higher, the stronger the knot straightens">Stiff. <input type="range" id="bendCoef" min="1" max="20" step="1" value="9"><b id="bendVal">9</b></span>
      <span class="chip" title="Tight packing: the knot shrinks to near contact (held only by contact repulsion). A separate mode — NOT stiffness"><label style="cursor:pointer">Tight <input type="checkbox" id="tightChk"></label></span>
      <span class="chip" title="Self-repulsion r, 1–10: strands cannot come closer than (w+r) units between axes; beyond that a 1/Δ⁴ repulsion (×5 since 2.35)">Repel. <input type="range" id="repCoef" min="1" max="10" step="1" value="2"><b id="repVal">2</b></span>
      <span class="chip" title="Number of tries (minimization attempts), 1–20: each try starts from the diagram with its own random heights of the knot parts; applies to the next run">Tries <input id="msN" type="number" min="1" max="20" value="5"></span>
      <span class="chip" title="Stir: inflate the final knot k times relative to the tube (the core starts at 1/k, is held, then grows back), then the tries run again">Stir ×<input id="stirInfl" type="number" min="1.5" max="50" step="0.5" value="10" title="inflate ×k: the knot is inflated k times relative to the tube (core starts at 1/k), then standard physics" style="width:44px"></span>
      <button id="play" class="go" title="Physics: run the tries · Pause · Stir: pull loops of the final shape out into free space (topology-safe; mode select: loops | inside-out inversion; falls back to pulling parts apart) and rerun the tries">▶ Physics</button>
      <button id="exportObj" class="ghost" title="Export the 3D model as OBJ">OBJ</button>
      <button id="exportTelem" class="ghost" title="Download relaxation telemetry for diagnostics">Telem</button>
      <span class="tspacer"></span>
    </div>
    <div class="stagewrap">
      <canvas id="gl"></canvas>
      <div class="vignette"></div>
      <div id="msDock"></div>
      <span class="statuspill" id="statusPill"><span class="dot"></span><span id="status">waiting for a knot…</span></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const __PAGE_SRC=(typeof document!=="undefined" && document.currentScript && document.currentScript.textContent) || "";   // исходник этой страницы — для безголовых копий в Web Worker (2.11)
// ---- РЕПОРТЁР ОШИБОК (3.5): непойманная JS-ошибка — в стандартном окне сообщений, как у системной программы ----
// (иначе «не запускается» выглядит как мёртвая страница без объяснений). Одинаковые сообщения — одно окно; не больше 3 окон за сеанс, остальное — в консоль
window.addEventListener('error', function(ev){
  try{
    const msg=String(ev.message||ev.error||'unknown error'), where=ev.filename? '\n'+ev.filename+':'+(ev.lineno||'') : '';
    const seen=window.__errSeen||(window.__errSeen={}); if(seen[msg]) return; seen[msg]=1;
    if(Object.keys(seen).length>3 || window.__isWorker || typeof window.alert!=='function') return;
    setTimeout(function(){ try{ window.alert('Program error: '+msg+where); }catch(e){} }, 0);
  }catch(e){}
});
if(typeof THREE==='undefined'){
  const msg='Could not load the three.js library from CDN — check your internet access (cdnjs.cloudflare.com, cdn.jsdelivr.net) and reload the page.';
  try{ window.__errSeen={'three.js CDN unavailable':1}; if(typeof window.alert==='function') window.alert(msg); }catch(e){}
  throw new Error('three.js CDN unavailable');
}
/* ============================================================================
   ЧАСТЬ A — 2D РЕДАКТОР: рисование, Catmull-Rom, поиск самопересечений,
   назначение над/под.
   ========================================================================== */
const drawCv = document.getElementById('draw');
const dctx   = drawCv.getContext('2d');
let DPR = Math.min(window.devicePixelRatio||1, 2);

let raw = [];            // сырые точки мыши {x,y}
let smooth = [];         // сглаженная замкнутая ломаная [{x,y}]
let cumLen = [];         // куммулятивная длина по smooth
let totalLen2D = 0;
let crossings = [];      // {x,y, sA, sB, over: 'A'|'B'}  (s — длина дуги)
let drawing = false, closedCurve = false;
const START_R = 13;      // радиус стартового кружка для замыкания
let _v2={s:1,tx:0,ty:0};   // вид 2D-холста: масштаб (≤1) и сдвиг, чтобы вся диаграмма была видна при сужении панели (данные не меняются)
function fitView(){ const pts=closedCurve? smooth : null; if(!pts || pts.length<2){ _v2={s:1,tx:0,ty:0}; return; }
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9; for(const q of pts){ if(q.x<minx)minx=q.x; if(q.x>maxx)maxx=q.x; if(q.y<miny)miny=q.y; if(q.y>maxy)maxy=q.y; }
  const w=drawCv.clientWidth, h=drawCv.clientHeight, m=CROSS_R+14; let sc=Math.min((w-2*m)/Math.max(1,maxx-minx), (h-2*m)/Math.max(1,maxy-miny)); if(!(sc<1)) sc=1; if(sc<0.15) sc=0.15;
  _v2={s:sc, tx:w/2-sc*(minx+maxx)/2, ty:h/2-sc*(miny+maxy)/2}; }

function fitCanvas(){
  const r = drawCv.getBoundingClientRect();
  drawCv.width  = Math.max(1, r.width *DPR);
  drawCv.height = Math.max(1, r.height*DPR);
  dctx.setTransform(DPR,0,0,DPR,0,0);
  renderDraw();
}
function P(e){
  const r = drawCv.getBoundingClientRect();
  return {x:(e.clientX-r.left-_v2.tx)/_v2.s, y:(e.clientY-r.top-_v2.ty)/_v2.s};   // экран → координаты диаграммы (вид _v2)
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

/* ============================================================================
   4.4: РЕЖИМ РЕДАКТИРОВАНИЯ — узел можно взять рукой и потащить.
   Замкнутая диаграмма сразу готова к работе: курсор-ладошка над верёвочкой, нажатие её
   «сжимает» и берёт кривую. Кусок около руки идёт за ней, остальное тянется следом:
   длины отрезков держатся проекцией (верёвка не удлиняется), лёгкое сглаживание даёт
   упругость на изгиб, перенос части прошлого смещения — вязкость. Пересечения
   пересчитываются на ходу, выбранные проходы переносятся по дуговым позициям;
   пересечение, родившееся при перетаскивании, становится «невыбранным» (белый кружок).
   ========================================================================== */
// 4.5: рука тянет верёвочку КОЛОКОЛОМ Гаусса: под рукой смещение точно равно ходу мышки, дальше плавно
// сходит на нет. Ширина колокола и сопротивление излому — от ползунка «Rigid.»: жёсткая верёвочка не
// переламывается под рукой, а ведёт за собой длинный пологий изгиб
const DRAG_SIG=22;      // σ колокола (px дуги) при жёсткости 1
const DRAG_SIG_K=78;    // прибавка к σ при жёсткости 10
const DRAG_CUT=2.6;     // колокол обрезаем на DRAG_CUT·σ (там он уже ~3 % и ноль по краю)
const DRAG_MOB_IN=2.2;  // в σ: докуда верёвочка полностью свободна…
const DRAG_MOB_OUT=5.5; // …и где она уже почти неподвижна
const DRAG_MOB_FL=0.08; // остаточная подвижность вдали: ноль намертво держал бы кольцо и верёвка тянулась,
                        // а так натяжение расходится по длинному дальнему куску и там видно почти ничего
const DRAG_ITER=20;     // прогонок проекции длин за один шаг (чётные — вперёд, нечётные — назад)
const DRAG_DAMP=0.55;   // вязкость: доля прошлого смещения, переносимая дальше
let _dragS=(7-1)/9;     // жёсткость 1..10 -> 0..1 (значение ползунка по умолчанию — 7: на нём верёвочка
                        // под рукой уже не ломается углом, а ведёт за собой плавный изгиб)
function _dragBendK(){ return 0.05+0.15*_dragS; }        // сила выпрямления за один проход
function _dragBendIt(){ return 1+Math.round(8*_dragS); } // и сколько проходов: жёстче — изгиб глаже и шире
let _kd=null;           // текущий захват: {i, rest, w, mob, prev, last, moved, acc}
function _kdGrabR(){ return Math.max(14, 3*CURVE_W/Math.max(0.15,_v2.s)); }   // на сколько близко надо подвести руку к верёвочке
function _kdNear(p){ let bi=-1, bd=Infinity; for(let i=0;i<smooth.length;i++){ const d=Math.hypot(smooth[i].x-p.x, smooth[i].y-p.y); if(d<bd){ bd=d; bi=i; } } return {i:bi, d:bd}; }
function _recumLen(){ const n=smooth.length; cumLen=[0]; totalLen2D=0;   // длины по текущей кривой (buildSmooth пересобирает из raw, а при перетаскивании raw не трогаем)
  for(let i=1;i<n;i++){ totalLen2D+=dist(smooth[i],smooth[i-1]); cumLen.push(totalLen2D); }
  totalLen2D+=dist(smooth[0], smooth[n-1]); }
function _kdSnap(){ return crossings.map(c=>({x:c.x, y:c.y, a:c.sA/totalLen2D, b:c.sB/totalLen2D, over:c.over, pending:!!c.pending})); }
function _kdKeep(snap, r){   // перенести выбранные проходы на пересчитанные пересечения
  // Ищем прежнее пересечение ПО ПОЛОЖЕНИЮ: за один шаг перетаскивания оно смещается на считанные пиксели,
  // а дуговые позиции уезжают вместе с перераспределением верёвки, и сопоставление по ним рвалось на большом ходе.
  // Какая прядь какой соответствует (то есть нужно ли менять A и B местами) решаем уже по дуговым позициям
  const cyc=(x,y)=>{ const d=Math.abs(x-y)%1; return Math.min(d,1-d); }, R=r||28;
  for(const c of crossings){ let best=null, bd=R*R;
    for(const o of snap){ const dx=c.x-o.x, dy=c.y-o.y, d=dx*dx+dy*dy; if(d<bd){ bd=d; best=o; } }
    if(best){ const a=c.sA/totalLen2D, b=c.sB/totalLen2D;
      const swap=(cyc(a,best.b)+cyc(b,best.a)) < (cyc(a,best.a)+cyc(b,best.b));
      c.over = swap? (best.over==='A'?'B':'A') : best.over; c.pending=best.pending; }
    else c.pending=true; }   // пересечение родилось при перетаскивании: о проходе ничего не известно
}
function _kdStart(p, i){
  const n=smooth.length, rest=new Float64Array(n), w=new Float32Array(n), mob=new Float32Array(n);
  // σ ограничиваем так, чтобы неподвижная зона (DRAG_MOB_OUT·σ) умещалась в полукольце: иначе «далеко» на узле нет
  const sig=Math.min(DRAG_SIG+DRAG_SIG_K*_dragS, totalLen2D/(2*DRAG_MOB_OUT));
  for(let k=0;k<n;k++){ const a=smooth[k], b=smooth[(k+1)%n]; rest[k]=Math.hypot(b.x-a.x, b.y-a.y); }
  const e0=Math.exp(-0.5*DRAG_CUT*DRAG_CUT);
  for(let k=0;k<n;k++){ const t=arcDist2D(cumLen[i], cumLen[k])/sig;
    w[k]= t>=DRAG_CUT? 0 : (Math.exp(-0.5*t*t)-e0)/(1-e0);           // колокол: 1 под рукой, 0 на краю — без ступеньки
    // подвижность: за DRAG_MOB_OUT·σ точки закреплены намертво, и натяжение кольца туда не уходит.
    // Полоса подвижного гораздо шире колокола — иначе взятому куску неоткуда взять слабину и верёвка тянется
    const u=(t-DRAG_MOB_IN)/(DRAG_MOB_OUT-DRAG_MOB_IN), c=Math.cos(1.5707963*u);
    mob[k]= u<=0? 1 : DRAG_MOB_FL+(1-DRAG_MOB_FL)*(u>=1? 0 : c*c);
    if(mob[k]<w[k]) mob[k]=w[k]; }
  const rc=new Float64Array(n+1); for(let k=0;k<n;k++) rc[k+1]=rc[k]+rest[k];   // для длинных связей: длина верёвочки между любыми двумя точками
  _kd={i, rest, rc, w, mob, prev:smooth.map(q=>({x:q.x,y:q.y})), last:{x:p.x,y:p.y}, moved:false, acc:0};
}
function _kdStep(pull){
  const n=smooth.length, K=_kd, mob=K.mob;
  // Вязкость переносит часть прошлого смещения — но только ТУДА, ГДЕ НЕ ДЕРЖИТ РУКА: под рукой (вес 1)
  // её нет совсем. Иначе перенос складывался с ходом руки, точка обгоняла мышку, закрепление возвращало её
  // назад — и ровно в этом месте верёвочка ломалась углом, а сама разгонялась до 1/(1-DAMP) ≈ 2,2 хода
  for(let k=0;k<n;k++){ const q=smooth[k], pv=K.prev[k], m=DRAG_DAMP*mob[k]*(1-K.w[k]),
        vx=(q.x-pv.x)*m, vy=(q.y-pv.y)*m;
    pv.x=q.x; pv.y=q.y; q.x+=vx; q.y+=vy; }
  // рука: смещение точки = ход мышки × вес колокола, без скидок. Под рукой вес 1 — точка идёт ровно за мышкой,
  // и закрепление после прогонок длин уже ничего не двигает: оно стало страховкой, а не рывком
  if(pull) for(let k=0;k<n;k++){ const w=K.w[k]; if(w>0){ smooth[k].x+=pull.x*w; smooth[k].y+=pull.y*w; } }
  const bk=_dragBendK(), bit=_dragBendIt();                                                                 // жёсткость на изгиб: несколько проходов выпрямления
  for(let t=0;t<bit;t++) for(let k=0;k<n;k++){ const m=mob[k]<=DRAG_MOB_FL? 0 : mob[k]; if(m<=0) continue;
    const a=smooth[(k-1+n)%n], b=smooth[k], c=smooth[(k+1)%n];
    b.x+=bk*m*((a.x+c.x)/2-b.x); b.y+=bk*m*((a.y+c.y)/2-b.y); }
  // нерастяжимость: прогонка Гаусса-Зейделя ПО ОЧЕРЕДИ вперёд и назад. Внутри одной прогонки поправка
  // передаётся соседу сразу, поэтому пара «вперёд-назад» разносит натяжение по всему подвижному куску, а не на
  // DRAG_ITER точек, как при одностороннем обходе (с ним верёвка удлинялась на 15 %).
  // Поправку делим по подвижности: у закреплённой точки она нулевая, и дальше по кольцу натяжение не идёт
  for(let it=0; it<DRAG_ITER; it++){ const back=it&1;
    for(let j=0;j<n;j++){ const k=back? n-1-j : j, k2=(k+1)%n, a=smooth[k], b=smooth[k2];
      let dx=b.x-a.x, dy=b.y-a.y; const L=Math.hypot(dx,dy)||1e-9, f=0.5*(L-K.rest[k])/L; dx*=f; dy*=f;
      a.x+=dx; a.y+=dy; b.x-=dx; b.y-=dy; }
    if(pull){ const q=smooth[K.i]; q.x=K.last.x; q.y=K.last.y; } }   // рука держит взятую точку: закрепление после каждой прогонки — это её краевое условие
}
function _kdMove(p){
  const K=_kd, d={x:p.x-K.last.x, y:p.y-K.last.y};
  K.last={x:p.x, y:p.y}; K.acc+=Math.abs(d.x)+Math.abs(d.y); if(K.acc>0) K.moved=true;
  const snap=_kdSnap();   // снимок берём ДО шага: дуговые позиции и totalLen2D должны быть из одной эпохи
  _kdStep(d);
  _recumLen();
  if(K.acc>=3){ K.acc=0; findCrossings(); _kdKeep(snap); updateCrossInfo(); }   // пересечения — не чаще, чем раз в 3 px пути: пересчёт стоит ~5 мс
  renderDraw();
}
function _kdEnd(){
  if(!_kd) return; const moved=_kd.moved, snap=_kdSnap();
  // 4.6: на отпускании форма НЕ меняется. Раньше здесь шли 14 шагов «успокоения» (а в каждом ещё и проходы
  // выпрямления — до сотни за раз) и пересборка кривой сплайном по прорежённым точкам: узел дёргался в момент,
  // когда руку уже убрали. Теперь то, что видно под рукой, и есть итог: жёсткость одна и та же до и после
  _recumLen(); _kd=null;
  if(moved){ raw=smooth.map(q=>({x:q.x, y:q.y})); findCrossings(); _kdKeep(snap);
    updateCrossInfo(); updateKnotType(); renderDraw(); syncKnot3D();
    setStatus(pendingCount()? 'edited: choose over or under at the white circles' : 'edited — press ▶ Physics'); }
  else renderDraw();
  drawCv.style.cursor='grab';
}
drawCv.addEventListener('pointerdown',e=>{
  if(closedCurve){ const p=P(e);
    for(const c of crossings) if(Math.hypot(c.x-p.x, c.y-p.y)<16){ tryToggleCrossing(p); return; }   // кольцо пересечения — переключаем проход, как раньше
    const g=_kdNear(p);
    if(g.i>=0 && g.d<=_kdGrabR()){ if(running) stopPhysics('');   // взяли верёвочку: 2D меняется, значит прежний прогон физики недействителен

  try{ drawCv.setPointerCapture(e.pointerId); }catch(_){}

drawCv.addEventListener('pointermove',e=>{

function finishCurve(doClose, quiet){
  drawing=false;

  closedCurve=true;
  buildSmooth();
  findCrossings();

  autoThick();               // замкнутая кривая — начальная толщина по числу пересечений (трубку построит syncKnot3D)

    ? 'Drag the rope to reshape it · click a crossing to flip over/under.'

// собрать/пересобрать 3D-узел и вписать его в кадр по центру
function syncKnot3D(){

}

// --- сглаживание замкнутой кривой Catmull-Rom (через three.js) ---
function buildSmooth(){
  // прорядим сырые точки
  const pts=[];
  for(let i=0;i<raw.length;i++){
    if(i===0||dist(raw[i],pts[pts.length-1])>4) pts.push(raw[i]);
  }
  if(pts.length>4 && dist(pts[0],pts[pts.length-1])<6) pts.pop();
  if(pts.length<4){ smooth=[]; cumLen=[0]; totalLen2D=0; closedCurve=false; return; }
  const v = pts.map(p=>new THREE.Vector3(p.x,p.y,0));
  const curve = new THREE.CatmullRomCurve3(v, true, 'centripetal', 0.5);
  const n = Math.min(1000, Math.max(160, pts.length*6));   // плотным рисункам — больше точек (до 1000)
  const sp = curve.getPoints(n);          // n+1, последняя == первая
  smooth = sp.slice(0,n).map(q=>({x:q.x,y:q.y}));
  // куммулятивные длины (замкнуто)
  cumLen=[0]; totalLen2D=0;
  for(let i=1;i<smooth.length;i++){ totalLen2D+=dist(smooth[i],smooth[i-1]); cumLen.push(totalLen2D); }
  totalLen2D += dist(smooth[0], smooth[smooth.length-1]);
}

// --- пересечение отрезков ---
function segInt(p1,p2,p3,p4){
  const d1x=p2.x-p1.x,d1y=p2.y-p1.y,d2x=p4.x-p3.x,d2y=p4.y-p3.y;
  const den=d1x*d2y-d1y*d2x;
  if(Math.abs(den)<1e-9) return null;
  const t=((p3.x-p1.x)*d2y-(p3.y-p1.y)*d2x)/den;
  const u=((p3.x-p1.x)*d1y-(p3.y-p1.y)*d1x)/den;
  // полуоткрытый [0,1): пересечение точно в вершине ломаной учитывается РОВНО один
  // раз (в следующем сегменте), а не отбрасывается в обоих смежных, как раньше
  if(t<0||t>=1||u<0||u>=1) return null;
  return {x:p1.x+t*d1x, y:p1.y+t*d1y, t, u};
}
function arcAt(i,t){ // длина дуги в точке сегмента i (между smooth[i],smooth[i+1])
  const a=cumLen[i];
  const b=(i+1<cumLen.length)?cumLen[i+1]:totalLen2D;
  return a+t*(b-a);
}
function norm2(v){ const L=Math.hypot(v.x,v.y)||1; return {x:v.x/L, y:v.y/L}; }
function findCrossings(){

  // раньше близость <14px к ЧУЖОМУ пересечению молча удаляла настоящее пересечение
  // (другая пара прядей) → диаграмма врала, определитель считал другой узел.
  const sTol = 1e-6*totalLen2D;   // только точные дубли (пересечение в общей вершине соседних отрезков); прежние 3 хорды сливали настоящие бигоны
  for(let i=0;i<N;i++){
    const a1=smooth[i], a2=smooth[(i+1)%N];
    for(let j=i+2;j<N;j++){
      if(i===0 && j===N-1) continue;        // соседние через замыкание
      const b1=smooth[j], b2=smooth[(j+1)%N];
      const hit=segInt(a1,a2,b1,b2);
      if(!hit) continue;
      const sA=arcAt(i,hit.t), sB=arcAt(j,hit.u);
      // дубль — только если СОВПАДАЮТ ОБЕ дуговые позиции (та же пара прядей)
      let dup=false;
      for(const c of crossings){
        if(arcDist2D(c.sA,sA)<sTol && arcDist2D(c.sB,sB)<sTol){ dup=true; break; }
      }
      if(dup) continue;
      // касательные обеих прядей — для качественной отрисовки прохода
      const dirA=norm2({x:a2.x-a1.x,y:a2.y-a1.y}), dirB=norm2({x:b2.x-b1.x,y:b2.y-b1.y});
      crossings.push({x:hit.x,y:hit.y, sA, sB, over:'A', dirA, dirB});

}
function arcDist2D(a,b){ let d=Math.abs(a-b); return Math.min(d, totalLen2D-d); }

function updateCrossInfo(){

const CURVE_W = 4.4;      // 4.2: толщина верёвочки в ЭКРАННЫХ пикселях (была плоская линия 5 в координатах диаграммы)

// точка на сглаженной кривой по длине дуги s (циклически)
function arcPointOn(s){

// точки куска кривой [s0-half, s0+half] вдоль настоящей кривой (считаем один раз на кадр, обводим несколько раз)
function arcSpanPts(s0, half, step){
  const st=step||2, n=Math.max(2, Math.ceil(2*half/st)+1), out=new Float64Array(2*n);
  for(let i=0;i<n;i++){ const p=arcPointOn(s0-half+2*half*i/(n-1)); out[2*i]=p.x; out[2*i+1]=p.y; }

}
// обвести кусок кривой (осталось для совместимости: разрыв/верх идут вдоль настоящей кривой)
function strokeSpanOn(s0,half){ _putFlat(arcSpanPts(s0,half),0,0,0,false); dctx.stroke(); }
function _flatOf(pts){ const a=new Float64Array(2*pts.length); for(let i=0;i<pts.length;i++){ a[2*i]=pts[i].x; a[2*i+1]=pts[i].y; } return a; }
// 4.5: отрезки по длине дуги (кольцо): объединение и вычитание. Нужны, чтобы КАЖДЫЙ кусок верёвочки
// рисовался ровно один раз: полупрозрачные слои (тень, блик, притенение), наложенные второй раз,
// давали на плотном узле «чешую» из капсул, а кусок соседнего пересечения мог ещё и затянуть чужой разрыв
function _arcMerge(list, total){
  const seg=[];
  for(const it of list){ if(it.b-it.a>=total) return [{a:0, b:total}];
    let a=it.a%total, b=it.b%total; if(a<0) a+=total; if(b<0) b+=total;
    if(a<=b) seg.push({a, b}); else { seg.push({a, b:total}); seg.push({a:0, b}); } }

    if(last && x.a<=last.b+1e-9){ if(x.b>last.b) last.b=x.b; } else out.push({a:x.a, b:x.b}); }
  if(out.length>1 && out[0].a<=1e-9 && out[out.length-1].b>=total-1e-9){   // кусок через ноль — один отрезок, иначе на стыке шов
    const first=out.shift(); out[out.length-1].b += first.b; }

}
function _arcSub(A, B){
  let out=[];
  for(const a of A){ let cur=[{a:a.a, b:a.b}];
    for(const b of B){ const nx=[];
      for(const c of cur){ if(b.b<=c.a || b.a>=c.b){ nx.push(c); continue; }
        if(b.a>c.a) nx.push({a:c.a, b:b.a});
        if(b.b<c.b) nx.push({a:b.b, b:c.b}); }
      cur=nx; if(!cur.length) break; }
    out=out.concat(cur); }
  return out;
}
// 4.5: кольцо минус дырки -> куски. Кусок через ноль остаётся ОДНИМ (иначе на стыке s=0 виден шов)
function _arcPieces(holes, total){
  if(!holes.length) return null;
  const out=_arcSub([{a:0, b:total}], holes);
  if(out.length>1 && out[0].a<=1e-9 && out[out.length-1].b>=total-1e-9){
    const first=out.shift(); out[out.length-1].b += first.b; }
  return out;
}
function arcRangePts(a, b){   // кусок кривой от дуги a до дуги b — ПО ТЕМ ЖЕ точкам smooth, что и основная кривая
  // (пересэмплирование с другим шагом слегка срезает углы, и дорисованный кусок ложился на кривую со ступенькой),
  // концы — точные точки по дуге
  const n=smooth.length, len=b-a; if(!(len>0) || n<2) return new Float64Array(0);
  const A=((a%totalLen2D)+totalLen2D)%totalLen2D, out=[];
  let lo=0, hi=n-1; while(lo<hi){ const m=(lo+hi)>>1; if(cumLen[m]<=A) lo=m+1; else hi=m; }
  let k=(cumLen[lo]<=A)? 0 : lo, acc=cumLen[k]-A; if(acc<0) acc+=totalLen2D;
  const pa=arcPointOn(a); out.push(pa.x, pa.y);
  for(let g=0; acc<len-1e-9 && g<2*n; g++){ out.push(smooth[k].x, smooth[k].y);
    const nk=(k+1)%n; acc+=(nk===0? totalLen2D : cumLen[nk])-cumLen[k]; k=nk; }
  const pb=arcPointOn(b); out.push(pb.x, pb.y);

// 4.3: путь по плоскому массиву координат. off — смещение по НОРМАЛИ к кривой (блик и притенение идут вдоль верёвочки
// и не рассыпаются в бусины на дрожащем рисунке от руки, как смещение в одну сторону экрана), dx/dy — сдвиг по экрану
// (тень на бумаге; она в разы шире сдвига, поэтому выглядит мягкой копией, а не бусинами). Сдвиг применяем к ТОЧКАМ:

function _putFlat(a, off, dx, dy, closed, lit){
  const n=a.length>>1; if(n<2) return;

    if(off){ const p=closed? (i-1+n)%n : Math.max(0,i-1), q=closed? (i+1)%n : Math.min(n-1,i+1);
      const ux=a[2*q]-a[2*p], uy=a[2*q+1]-a[2*p+1], L=Math.hypot(ux,uy);
      if(L>1e-9){ const nx=-uy/L, ny=ux/L;

        // и плавно переходит через ось там, где верёвочка идёт вдоль света (скачков нет, значит нет и бусин)
        const k=off*(lit? -(nx*LIT_X+ny*LIT_Y) : 1);

// теневая и освещённая стороны, узкий блик. Тени рисуются смещёнными полосами, а не shadowBlur: размытие
// длинного пути дорого в браузере и в стенде. Каждый слой уже полщины тела, смещение меньше полуширины —
// поэтому ни один слой не вылезает за силуэт даже на крутых поворотах

    put(0, 0.43*W*LIT_X, 0.43*W*LIT_Y); dctx.globalAlpha=0.13; dctx.lineWidth=1.18*W; dctx.stroke();

    dctx.globalAlpha=1; }
}
const CROSS_R=14;   // радиус зоны пересечения: вписывание кадра и расстановка Random (попадание по клику — 16 px)
const CROSS_RV=8.5;   // 4.4: сам кружок рисуем мельче — «кто сверху» держится на тени, а не на большом разрыве и кольце
function _minCrossDist(){ let m=Infinity; for(let i=0;i<crossings.length;i++) for(let j=i+1;j<crossings.length;j++){ const d=Math.hypot(crossings[i].x-crossings[j].x, crossings[i].y-crossings[j].y); if(d<m) m=d; } return m; }

function _ikRun(src, dst, base, stride, len, r, isMax, q){   // скользящий max/min окна 2r+1 вдоль строки или столбца (монотонная очередь, O(len)); у краёв окно усечено

}

async function ikLoadFile(file){   // файл (кнопка Image, перетаскивание, вставка) → ImageData ≤1600 px → распознавание → редактор
  if(!file) return;
  if(!/^image\//.test(file.type||'') && !/\.(png|jpe?g|gif|webp|bmp|svg|avif|heic|heif)$/i.test(file.name||'')){ ikFail('the file is not an image'); return; }

  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,no)=>{ const x=new Image(); x.onload=()=>ok(x); x.onerror=()=>no(new Error('the browser cannot decode this file')); x.src=url; });
    let W0=im.naturalWidth||im.width||0, H0=im.naturalHeight||im.height||0; if(!(W0>0 && H0>0)){ W0=1000; H0=1000; }
    const sc=Math.min(1, 1600/Math.max(W0,H0)), W=Math.max(8, Math.round(W0*sc)), H=Math.max(8, Math.round(H0*sc));
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const cx=cv.getContext('2d', {willReadFrequently:true}); cx.drawImage(im, 0, 0, W, H);
    const data=cx.getImageData(0, 0, W, H);
    await new Promise(r=>setTimeout(r, 20));   // статус «recognising…» успевает отрисоваться
    const res=ikRecognize(data); window.__ikLast=res && {ok:res.ok, msg:res.msg, ms:res.ms, notes:res.notes, W:res.W, H:res.H, hw:res.hw};
    ikApply(res);
  }catch(e){ ikFail((e && e.message)||String(e)); }
  finally{ URL.revokeObjectURL(url); }
}
if(typeof window!=='undefined' && !window.__isWorker){   // кнопка Upload, перетаскивание файла в поле 2D, вставка картинки из буфера (⌘V)

    if(p!==c){ const t=M[p]; M[p]=M[c]; M[c]=t; det=-det; }
    for(let r=c+1;r<n;r++){ const f=M[r][c]/M[c][c]; for(let k=c;k<n;k++) M[r][k]-=f*M[c][k]; }
    det*=M[c][c];
  }
  return det;
}
function computeDeterminant(){
  const n=crossings.length; if(n===0) return 1;
  const unders=[];
  crossings.forEach((c,ci)=>{ unders.push({ s:(c.over==='A'?c.sB:c.sA), ci }); });
  unders.sort((a,b)=>a.s-b.s);
  if(unders.length!==n) return 0;
  const arcOf=(s)=>{ let k=-1; for(let i=0;i<n;i++) if(unders[i].s<=s) k=i; return k===-1?n-1:k; };
  const M=Array.from({length:n},()=>new Array(n).fill(0));
  crossings.forEach((c,ci)=>{
    const sO=(c.over==='A'?c.sA:c.sB);
    let ku=-1; for(let i=0;i<n;i++) if(unders[i].ci===ci){ ku=i; break; }
    const aIn=(ku-1+n)%n, aOut=ku, aOv=arcOf(sO);
    M[ci][aIn]+=1; M[ci][aOut]+=1; M[ci][aOv]-=2;
  });

}
function autoThick(){   // начальная толщина по числу пересечений (2026-09-14): 5 при ≤0, линейно к 1 при 100 (большой узел не помещается толстым); ползунок остаётся ручным
  if(typeof window!=='undefined' && window.__noAutoThick) return;   // стенд: тесты задают толщину явно (harness.js ставит флаг)
  const nc=crossings.length, D=5, w=Math.max(1, Math.round(D-(D-1)*Math.min(nc,100)/100)); const el=document.getElementById('thick');
  thickCoef=w; if(el){ el.value=String(w); const v=document.getElementById('thickVal'); if(v) v.textContent=String(w); } updateGeomUnits(); }   // трубку перестраивает вызывающий (syncKnot3D после лифта); rebuildTube здесь менял траекторию стенда
function updateKnotType(){

// --- готовые узлы. Каждая запись задаёт плоскую диаграмму и схему над/под,
//     проверенно дающую именно этот узел после релаксации. ---
function starPoints(nPts,skip){
  const order=[]; for(let i=0;i<nPts;i++) order.push((i*skip)%nPts);
  const vts=order.map(k=>{ const a=-Math.PI/2 + k*2*Math.PI/nPts; return {x:Math.cos(a),y:Math.sin(a)}; });
  const out=[], M=vts.length;
  for(let e=0;e<M;e++){ const a=vts[e], b=vts[(e+1)%M];
    for(let s=0;s<16;s++){ const t=s/16; out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); } }
  return out;
}
function paramPoints(fn,n){ const out=[]; for(let i=0;i<=n;i++) out.push(fn(i/n*Math.PI*2)); return out; }

// торический узел (2,q) в 3D — симметричная «каноническая» форма-затравка
const torus3d=(q)=>(t)=>({x:(2+Math.cos(q*t))*Math.cos(2*t), y:(2+Math.cos(q*t))*Math.sin(2*t), z:Math.sin(q*t)});
const PRESETS = {
  // pts — плоская диаграмма для левой панели; init3d — симметричная 3D-затравка,
  // из которой релаксация приходит к КАНОНИЧЕСКОМУ виду (а не к «петля+узелок»).
  trefoil:   { alt:true, pts:()=>paramPoints(t=>({x:Math.sin(t)+2*Math.sin(2*t), y:Math.cos(t)-2*Math.cos(2*t)}),240), init3d:torus3d(3) },
  figure8:   { alt:true, pts:()=>paramPoints(t=>({x:(2+Math.cos(2*t))*Math.cos(3*t), y:(2+Math.cos(2*t))*Math.sin(3*t)}),260),
               init3d:t=>({x:(2+Math.cos(2*t))*Math.cos(3*t), y:(2+Math.cos(2*t))*Math.sin(3*t), z:Math.sin(4*t)}) },
  cinquefoil:{ alt:true, pts:()=>starPoints(5,2), init3d:torus3d(5) },
  septafoil: { alt:true, pts:()=>starPoints(7,2), init3d:torus3d(7) }
};

function fitToCanvas(pts, fill, both){
  // вписываем произвольные точки в холст по центру с полями
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const p of pts){ minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y); }
  const w=(drawCv.clientWidth>4)?drawCv.clientWidth:((drawCv.width>4)?drawCv.width:800), h=(drawCv.clientHeight>4)?drawCv.clientHeight:((drawCv.height>4)?drawCv.height:600);   // скрытая вкладка: холст 0/1 px
  const span=Math.max(maxx-minx,maxy-miny)||1, sc=both ? Math.min(w*fill/Math.max(1e-9,maxx-minx), h*fill/Math.max(1e-9,maxy-miny)) : Math.min(w,h)*(fill||0.62)/span;   // both: вписать по обеим осям (сетка, растянутая под панель)
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  return pts.map(p=>({x:w/2+(p.x-cx)*sc, y:h/2+(p.y-cy)*sc}));
}

// --- СЛУЧАЙНЫЙ УЗЕЛ: ряд Фурье с подбором числа пересечений (как в тестовой кампании) ---
function _rkFourier(rnd,K,p,M){
  const ax=[],ay=[],px=[],py=[];
  for(let k=1;k<=K;k++){ const dec=1/Math.pow(k,p); ax.push(dec*(0.4+rnd())); ay.push(dec*(0.4+rnd())); px.push(rnd()*6.283); py.push(rnd()*6.283); }
  const pts=[];
  for(let i=0;i<M;i++){ const a=i/M*2*Math.PI; let x=0,y=0;
    for(let k=1;k<=K;k++){ x+=ax[k-1]*Math.sin(k*a+px[k-1]); y+=ay[k-1]*Math.cos(k*a+py[k-1]); }
    pts.push({x,y}); }
  return pts;
}
function _rkCountCross(pts){ const M=pts.length; let c=0;
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  for(let i=0;i<M;i++){ const a=pts[i], b=pts[(i+1)%M];
    for(let j=i+2;j<M;j++){ if(i===0 && j===M-1) continue; const c1=pts[j], d1=pts[(j+1)%M];
      if(o(a,b,c1)*o(a,b,d1)<0 && o(c1,d1,a)*o(c1,d1,b)<0) c++; } }
  return c; }
// ---- СЛУЧАЙНАЯ ДИАГРАММА (2.02): сеточная диаграмма (grid diagram). Пересечения лежат
// только в узлах сетки, шаг сетки после вписывания ≥ 1.5·CROSS_R — маркеры пересечений
// никогда не слипаются. База — «торическая» сетка (σ=id, τ=сдвиг на s, gcd(s,n)=1:
// ≈n²/4 пересечений), случайность — j·n транспозиций в σ и τ. Затем гладкий
// диффеоморфный варп (|∇u|≤g) и поворот: комбинаторику диаграммы они не меняют,
// а сжатие расстояний ограничено; итог проверяется по факту (счёт и разнесение).
function _gcd(a,b){ while(b){ const t=a%b; a=b; b=t; } return a; }
function _gdCandidate(n, rnd, j){
  const sig=[...Array(n).keys()];
  let s=Math.round(n/2)+(rnd()<0.5?-1:1)*Math.floor(rnd()*Math.max(1,n/6)); s=Math.max(1,Math.min(n-1,s));
  while(_gcd(s,n)!==1) s=(s%(n-1))+1;
  const tau=sig.map(r=>(r+s)%n);
  const k=Math.round(j*n);
  for(let t=0;t<k;t++){ const a=Math.floor(rnd()*n), b=Math.floor(rnd()*n); [sig[a],sig[b]]=[sig[b],sig[a]]; }
  for(let t=0;t<k;t++){ const a=Math.floor(rnd()*n), b=Math.floor(rnd()*n); [tau[a],tau[b]]=[tau[b],tau[a]]; }
  for(let c=0;c<n;c++) if(sig[c]===tau[c]) return null;
  const sinv=new Array(n), tinv=new Array(n); for(let c=0;c<n;c++){ sinv[sig[c]]=c; tinv[tau[c]]=c; }
  let c=0, len=0; do{ c=sinv[tau[c]]; len++; }while(c!==0 && len<=n);
  if(len!==n) return null;                      // несколько компонент — зацепление, не узел
  let nc=0;                                     // вертикаль столбца c × горизонталь строки r
  for(let c2=0;c2<n;c2++){ const r0=Math.min(sig[c2],tau[c2]), r1=Math.max(sig[c2],tau[c2]);
    for(let r=r0+1;r<r1;r++){ const c0=Math.min(tinv[r],sinv[r]), c1=Math.max(tinv[r],sinv[r]); if(c2>c0 && c2<c1) nc++; } }
  return {n, sig, tau, sinv, nc};
}
function _gdPolygon(g){   // замкнутая ломаная в единицах сетки: X(c,σc) → O(c,τc) → по строке к X следующего столбца
  const P=[]; let c=0;
  do{ P.push({x:c, y:g.sig[c]}); P.push({x:c, y:g.tau[c]}); c=g.sinv[g.tau[c]]; }while(c!==0);
  return P;
}
function _gdCurve(P, n, rnd, gW, theta, ax, ay){
  const L=Math.max(1,n-1)*Math.max(ax,ay), M=3, modes=[];
  for(let m=0;m<M;m++){ const k=1+Math.floor(rnd()*2), a=(0.5+0.5*rnd())*gW*L/(2*Math.PI*k*M), e=rnd()*6.283, d=rnd()*6.283;
    modes.push({k, a, ex:Math.cos(e), ey:Math.sin(e), dx:Math.cos(d), dy:Math.sin(d), ph:rnd()*6.283}); }
  const ct=Math.cos(theta), st=Math.sin(theta);
  const warp=p=>{ let x=p.x, y=p.y;
    for(const m of modes){ const u=m.a*Math.sin(2*Math.PI*m.k*(p.x*m.ex+p.y*m.ey)/L+m.ph); x+=u*m.dx; y+=u*m.dy; }
    return {x:x*ct-y*st, y:x*st+y*ct}; };
  // СКРУГЛЕНИЕ УГЛОВ (2.35, по просьбе пользователя): прямые углы решётки заменяются дугами
  // (радиус до 0.42 клетки, не дальше 45 % смежного ребра) — пересечения лежат в узлах решётки
  // не ближе целой клетки от углов и не затрагиваются; 3D-лифт следует 2D-кривой и тоже без углов
  const Q=P.map(p=>({x:ax*p.x, y:ay*p.y})), nP=Q.length, R0=0.42, K=6, step=1/3, pts=[];
  const arcs=[];   // для каждого угла: точки дуги от входа до выхода (или сам угол, если поворота нет)
  for(let i=0;i<nP;i++){ const a=Q[(i-1+nP)%nP], b=Q[i], c=Q[(i+1)%nP];
    const l1=Math.hypot(b.x-a.x,b.y-a.y), l2=Math.hypot(c.x-b.x,c.y-b.y); if(l1<1e-9 || l2<1e-9){ arcs.push([b]); continue; }
    const d1x=(b.x-a.x)/l1, d1y=(b.y-a.y)/l1, d2x=(c.x-b.x)/l2, d2y=(c.y-b.y)/l2;
    const cr=d1x*d2y-d1y*d2x, dt=d1x*d2x+d1y*d2y, th=Math.atan2(Math.abs(cr), dt);   // угол поворота
    if(th<0.05){ arcs.push([b]); continue; }
    const tn=Math.tan(th/2), t=Math.min(0.45*l1, 0.45*l2, R0*tn), R=t/tn, sg=cr>0?1:-1;   // t — отступ касания от угла
    const Sx=b.x-t*d1x, Sy=b.y-t*d1y, Cx=Sx-sg*d1y*R, Cy=Sy+sg*d1x*R;                     // центр — на нормали к входу
    const arc=[]; for(let k=0;k<=K;k++){ const ph=sg*th*k/K, vx=Sx-Cx, vy=Sy-Cy; arc.push({x:Cx+vx*Math.cos(ph)-vy*Math.sin(ph), y:Cy+vx*Math.sin(ph)+vy*Math.cos(ph)}); }
    arcs.push(arc); }
  for(let i=0;i<nP;i++){ const A=arcs[i], B=arcs[(i+1)%nP]; for(const p of A) pts.push(warp(p));
    const e=A[A.length-1], s0=B[0]; const len=Math.hypot(s0.x-e.x,s0.y-e.y), m=Math.max(1,Math.ceil(len/step));
    for(let t=1;t<m;t++){ const f=t/m; pts.push(warp({x:e.x+(s0.x-e.x)*f, y:e.y+(s0.y-e.y)*f})); } }
  return pts;
}
function randomKnot(target){
  target=Math.max(1, Math.min(250, Math.round(target||20)));   // лимит 250 (2026-09-14)
  if(running) stopPhysics('');
  let seed=(Math.floor(Math.random()*2147483647))|1;
  const rnd=()=>{ seed=(Math.imul(seed,1103515245)+12345)&0x7fffffff; return seed/0x80000000; };   // строго <1
  const SEP=1.5*CROSS_R, FILL=0.9;
  const W=(drawCv.clientWidth>4)?drawCv.clientWidth:((drawCv.width>4)?drawCv.width:800), Hh=(drawCv.clientHeight>4)?drawCv.clientHeight:((drawCv.height>4)?drawCv.height:600);
  const nMax=Math.max(4, Math.floor(FILL*Math.min(W,Hh)/(SEP*1.03))+1);   // шаг сетки после вписывания ≥ 1.03·SEP
  const nLo=Math.min(nMax, Math.max(3, Math.ceil(2*Math.sqrt(target))-2)), nHi=Math.min(nMax, nLo+8);
  // перебор кандидатов: точное число пересечений, при равенстве — больше случайности (j)
  let best=null; const tGen=performance.now();
  for(let it=0; it<4000 || (best && best.err>0 && it<60000 && performance.now()-tGen<250); it++){   // точное попадание ищем дольше
    const n=nLo+Math.floor(rnd()*(nHi-nLo+1)), j=0.05+1.15*rnd()*rnd();
    const g=_gdCandidate(n, rnd, j); if(!g) continue;
    const score=Math.abs(g.nc-target)*100-j*10-rnd();
    if(!best || score<best.score) best={g, j, score, err:Math.abs(g.nc-target)};
    if(it>=600 && best.err===0) break;
  }
  if(!best){ showError('could not build a diagram'); return; }
  const g=best.g, P=_gdPolygon(g);
  // сетка растягивается под пропорции панели (до 1.5×) и вписывается по обеим осям
  const asp=Math.min(1.5, Math.max(W,Hh)/Math.max(1,Math.min(W,Hh))), ax=(W>=Hh)?asp:1, ay=(W>=Hh)?1:asp;
  const cell=FILL*Math.min(W,Hh)/Math.max(1,g.n-1), slack=Math.max(0, 1-SEP/cell);   // запас на варп и поворот
  let gW=Math.min(0.6, 0.45*slack), theta=(rnd()<0.5?-1:1)*Math.min(0.4, 0.5*slack), ok=false;
  for(let tryN=0; tryN<5; tryN++){
    if(tryN===4){ gW=0; theta=0; }
    raw=fitToCanvas(_gdCurve(P, g.n, rnd, gW, theta, ax, ay), FILL, true); closedCurve=false; drawing=false; finishCurve(true, true);
    if(closedCurve && crossings.length===g.nc && _minCrossDist()>=SEP){ ok=true; break; }
    gW*=0.5; theta*=0.5;
  }
  finishCurve(true);
  if(!closedCurve){ showError('could not build a diagram (window not rendered?)'); return; }
  for(const c of crossings) c.over = rnd()<0.5?'A':'B';
  updateKnotType(); autoThick(); renderDraw(); syncKnot3D();
  setStatus('random diagram: '+crossings.length+' crossings (grid '+g.n+'×'+g.n+'), over/under random · '+(isUnknot?'unknot':'det '+knotDet)
    +(crossings.length!==target ? ' · ⚠ requested '+target+(nHi>=nMax ? ' (window limit '+nMax+'×'+nMax+')' : ' (no exact grid found)') : '')+(ok?'':' · ⚠ crossings closer than 1.5 marker radii')+' · press ▶ Physics');
}
function loadPreset(key){
  const P=PRESETS[key]; if(!P) return;
  raw=fitToCanvas(P.pts());
  closedCurve=false; drawing=false;
  finishCurve(true);                     // строит 2D-диаграмму и 3D через лифт
  if(P.alt){ assignAlternating(); updateKnotType(); renderDraw(); }
  if(P.init3d){ initVerts3D(P.init3d); rebuildTube(); fitCamera(false); }  // симметричная 3D-затравка
}
// поставить 3D-узел из параметрической функции fn(t), сохранив N и полную длину N·L0
function initVerts3D(fn){
  if(!verts.length) return;
  const n=N, pa=[];
  for(let i=0;i<n;i++) pa.push(fn(i/n*Math.PI*2));
  let cx=0,cy=0,cz=0; pa.forEach(p=>{cx+=p.x;cy+=p.y;cz+=p.z;}); cx/=n;cy/=n;cz/=n;
  for(let i=0;i<n;i++) verts[i].set(pa[i].x-cx, pa[i].y-cy, pa[i].z-cz);
  let tl=0; for(let i=0;i<n;i++) tl+=verts[i].distanceTo(verts[(i+1)%n]);
  if(tl>1e-6){ const f=(N*L0)/tl; for(const v of verts) v.multiplyScalar(f); }
  resampleEqualArc();
  recenter();
}

// РАВНОДУГОВОЙ РЕСЭМПЛ замкнутой ломаной (на месте): та же кривая, но вершины
// на равных дуговых интервалах; L0 пересчитывается. КОРЕНЬ «стартового
// всплеска»: параметрические затравки и лифт дают рёбра разной длины (±30%),
// и первая же Якоби-проекция длин, таща вершины ВДОЛЬ кривой, раскачивала
// поперечный шум — гладкая затравка (E=2.3) за три шага превращалась в ежа
// (E=121) ДАЖЕ ПРИ ВЫКЛЮЧЕННЫХ СИЛАХ. На равнодуговой кривой проекции нечего
// делать — старт тихий.
function resampleEqualArc(){
  const n=N; if(n<4 || !verts.length) return;
  // Ресэмпл по СПЛАЙНУ (Катмулл-Ром, центростремительный), а не по хордам:
  // кусочно-линейная интерполяция воспроизводила ломаную сама в себя, и
  // связка «стягивание + ресэмпл» имела неподвижные точки-многоугольники —
  // узел застывал с видимыми прямыми гранями и углами ~7.5° (замечание
  // пользователя «состоит из ломаных»). Сплайн скругляет фасетки.
  const curve=new THREE.CatmullRomCurve3(verts, true, 'centripetal', 0.5);
  // ВАЖНО: дефолтные 200 сэмплов длины на всю кривую грубее нашей сетки
  // (N до 260) — «равнодуговые» позиции гуляли на ~величину сегмента, каждый
  // шаг впрыскивая мелкий шум: по узлу бежала рябь и он не останавливался
  curve.arcLengthDivisions=Math.max(800, 4*n);
  const pts=curve.getSpacedPoints(n);          // n+1, последняя = первая
  let tl=0;
  for(let i=0;i<n;i++){
    const a=pts[i], b=pts[(i+1)%n];
    tl+=Math.hypot(b.x-a.x, b.y-a.y, b.z-a.z);
  }
  if(tl<1e-9) return;
  for(let i=0;i<n;i++) verts[i].set(pts[i].x, pts[i].y, pts[i].z);
  L0=tl/n;
}

/* ============================================================================
   ЧАСТЬ B — ЛИФТ 2D → 3D с учётом над/под, и ресэмплинг до N вершин.
   ========================================================================== */
let N = 160;                 // число сегментов (подбирается под длину рисунка)
let verts = [];              // [THREE.Vector3] замкнутая цепочка
let L0 = 0;                  // длина ОДНОГО жёсткого сегмента (постоянна)
let worldScale=1, worldCx=0, worldCy=0;

// рабочие буферы (перевыделяются при изменении N): _s* — сдвиги (segCollide и
// проекция длин), _f* — силы, _p* — позиции «до шага» для детекта равновесия

  // ними постоянна, проход второго пересечения верен и без своей вершины), якоря

let _projOnce=false, _projCap=0, _dbgUnstick=0;
// РАЗЛИПАНИЕ ТЕСНЫХ ПАР на старте: у честного лифта пряди-соседи могут лежать
// в 1e-4·D друг от друга (параллельные штрихи на одной высоте). Самую тесную пару
// раздвигаем вдоль ЕЁ вектора разделения (её зазор при этом только растёт, сами
// отрезки переносятся параллельно), сдвиг ≤ 0.45·(зазор этих отрезков до любого
// ДРУГОГО несмежного отрезка) — по 1-липшицевости никакая другая пара не может

function unstickLift(maxRounds){

        const mj=mid(j); const dx=mj[0]-mi[0], dy=mj[1]-mi[1], dz=mj[2]-mi[2]; if(dx*dx+dy*dy+dz*dz>Rr2) continue;
        const r=_closestSeg(P(i),P((i+1)%n),P(j),P((j+1)%n));

    const qx=c.x+(d.x-c.x)*best.t, qy=c.y+(d.y-c.y)*best.t, qz=c.z+(d.z-c.z)*best.t;

    for(const k of [j,(j+1)%n]){ verts[k].x-=delta*ex; verts[k].y-=delta*ey; verts[k].z-=delta*ez; }

}
// СТАРТОВАЯ ДОПУСТИМОСТЬ, топологически безопасная: рёбра лифта неравны (±25%,
// якоря), а проекция длин, выравнивая их, может сдвигать дальние пряди друг к
// другу до нулевого зазора. Поэтому чередуем: разлипание тесных пар (сертификат
// Липшица по чужим зазорам) ⇄ ОДНА итерация ньютоновской проекции с капом
// 0.45·(минимальный зазор). Ни один шаг не может провести прядь сквозь прядь.
function startFeasibility(maxIt){
  const n=N; let err=0, it=0;

    err=0; for(let i=0;i<n;i++){ const e=Math.abs(verts[(i+1)%n].distanceTo(verts[i])-L0); if(e>err) err=e; }
    if(err<1e-9*L0 && minSegGap()>=0.95*0.05*sNominal()) break;   // 0.95: разлипание останавливается чуть ниже цели
    unstickLift(6);

}
// ПРОЕКЦИЯ ДЛИН С СЕРТИФИКАТОМ НЕПЕРЕСЕЧЕНИЯ (старт физики после лифта): каждая
// ньютоновская итерация масштабируется так, чтобы сдвиг любой вершины был
// < 0.45·(минимальный зазор перед итерацией). Расстояние между отрезками
// 1-липшицево по сдвигу концов, поэтому вдоль прямолинейного пути итерации
// две пряди не могут пройти друг сквозь друга. Возвращает остаточную ошибку длин.
function projectLengthsSafe(maxIt){
  const n=N; let err=0;
  for(let it=0; it<maxIt; it++){
    err=0;
    for(let i=0;i<n;i++){ const ip=(i+1)%n; const e=Math.abs(verts[ip].distanceTo(verts[i])-L0); if(e>err) err=e; }
    if(err<1e-9*L0) break;
    const g=energyGrad(false).gmin;                  // ≤ R=D+1.5·L0; дальние пары безопасны при капе 0.25·L0
    _projCap=Math.min(0.25*L0, 0.45*g); _projOnce=true;

function projectLengths(iter){
  const n=N, tol=1e-9*L0, maxIt=_projOnce? 1 : Math.max(iter,40), capD=(_projCap>0? _projCap : 0.25*L0), mob=_pinMob;   // mob — маска пинов: пины не двигаются, рёбра между пинами фиксированы

  for(let it=0;it<maxIt;it++){

    for(let i=0;i<n;i++){ const ip=(i+1)%n;
      const dx=verts[ip].x-verts[i].x, dy=verts[ip].y-verts[i].y, dz=verts[ip].z-verts[i].z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-12;

    if(errMax<tol) break;

    _tdFill(n);
    cyclicTriSolve(n,_tdA,_tdB,_tdC,_tdR,_sx);      // λ → _sx
    // Δx_i = λ_i·t_i − λ_{i−1}·t_{i−1}; ДЕМПФИРОВАНИЕ: на «шпильках» (t_i·t_{i+1}≈−1)
    // система почти вырождена и λ взрывается — поправка за итерацию не больше
    // 0.25·L0 (масштабируем всё решение равномерно), сходимость итерациями
    let mx=0;
    for(let i=0;i<n;i++){ const im=(i-1+n)%n, mi=mob? mob[i] : 1;

      verts[i].y+=sc*mi*(_sx[i]*_t2[i]-_sx[im]*_t2[im]);

  }
}

// один шаг передемпфированного спуска. Возвращает принятый максимальный сдвиг.
// собственные пары симметричной плотной матрицы (циклический Якоби; размер ≤ ~40)
function jacobiEig(A){   // fast: плоские Float64Array вместо массива строк — те же операции в том же порядке (вердикт седла бит-в-бит)

    let off=0; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){ const m=M[i*n+j]; off+=m*m; }
    if(off<1e-30) break;

// МИНИМАЛЬНАЯ МОДА ГЕССИАНА на многообразии жёстких длин. Ланцош (с полной

// он конгруэнтен H_T, поэтому знаки собственных значений те же, а спектр сжат в ~1e5 раз
// (жёсткие моды подавлены) — сходимость за десятки шагов вместо сотен. H·u — конечная
// разность проецированного градиента. Возвращает {lam, lamMax, its, v}: v = B·y —

  const restore=()=>{ for(let i=0;i<n;i++) verts[i].set(x0[i],x0[n+i],x0[2*n+i]); };
  const grad=(out)=>{ const e=energyGrad(true); if(!isFinite(e.E)) return false; dirTangentProject(8); removeRigidModes();
    for(let i=0;i<n;i++){ out[i]=-_fx[i]; out[n+i]=-_fy[i]; out[2*n+i]=-_fz[i]; } return true; };
  const applyB=(v)=>{ for(let i=0;i<n;i++){ _fx[i]=v[i]; _fy[i]=v[n+i]; _fz[i]=v[2*n+i]; }

// ВЫХОД ИЗ СЕДЛА: если минимальная мода отрицательна (относительно максимальной), пробный шаг
// вдоль неё (знак — по силе, амплитуда — обычный сертификат 0.35·gmin, три масштаба),
// проекция длин, принятие только при E↓ и целом ядре. Иначе состояние возвращается

  rec.lam2=+lamRing2().toExponential(3);

  const g0=energyGrad(true); const E0=g0.E, gm0=g0.gmin;

window.__knotMinMode=(k)=>{ const r=minMode(k||120); return r? {lam:r.lam, lamMax:r.lamMax, its:r.its} : null; };

/* ---- STIR (2.04 → 2.21): «серьёзное растаскивание» финальной формы. Нить режется на 3–6

   длин), пока части не разойдутся на STIR_AMP·R (R — радиус узла) или не кончатся шаги. Шаг
   ограничен теми же сертификатами, что и шаг физики (кап 0.35·gmin, полное смещение с проекцией,
   целое ядро) — пряди не проходят друг сквозь друга; при упоре кап уменьшается, после STIR_STALL

  const hemi=new THREE.HemisphereLight('#dcecff','#333c48', 0.6);
  scene.add(hemi);

  key.shadow.mapSize.set(2048,2048);

  key.shadow.camera.near=1; key.shadow.camera.far=40;

  key.shadow.camera.top=s; key.shadow.camera.bottom=-s;
  key.shadow.bias=-0.0006;
  scene.add(key);
  const fill=new THREE.DirectionalLight('#bcd4ff',0.6);
  fill.position.set(-8,4,-3); scene.add(fill);
  // контровой свет сзади-снизу: подсвечивает тёмную сторону, узел не пропадает

  rim.position.set(-4,-6,-8); scene.add(rim);

  // пол

  knotGroup=new THREE.Group();

  // меньше «металла» (металл в тёмной сцене чёрный) + слабое нейтральное

  tubeMat=new THREE.MeshStandardMaterial({

let _stA=null,_stB=null;   // сглаженная кривизна вершин — для окраски напряжения
function tubeGeometryFor(vs, lowRes, radius){   // трубка с картой напряжения для произвольного массива вершин (главный вид и окна попыток); lowRes — для живых окон
  const pts=vs.map(v=>v.clone());
  const curve=new THREE.CatmullRomCurve3(pts,true,'centripetal',0.5);
  const seg=lowRes===true? vs.length : (lowRes==='mid'? vs.length*2 : vs.length*3), RADS=lowRes===true? 8 : (lowRes==='mid'? 12 : 24);   // 'mid' — главный вид во время счёта (2.15)
  const geo=new THREE.TubeGeometry(curve, seg, (radius>0? radius : tubeRadius), RADS, true);
  // ОКРАСКА ПО НАПРЯЖЕНИЮ: изгибное напряжение проволоки ∝ локальной кривизне.
  // Шкала безразмерная и не зависит от дискретизации: κ/κ₀, где κ₀ — кривизна
  // ненапряжённого КОЛЬЦА той же длины (основное состояние замкнутой
  // проволоки). Зелёный = κ≈κ₀ (покоя), через жёлтый к красному = κ≥7·κ₀.
  // Кривизна сглажена (1-2-1, дважды), кольца трубки интерполируются между
  // вершинами — окраска живёт плавно, без мерцания на дискретизации.
  {
    const n=vs.length;
    const _stA=new Float64Array(n), _stB=new Float64Array(n);
    for(let i=0;i<n;i++){
      const im=(i-1+n)%n, ip=(i+1)%n;
      const ax=vs[i].x-vs[im].x, ay=vs[i].y-vs[im].y, az=vs[i].z-vs[im].z;
      const bx=vs[ip].x-vs[i].x, by=vs[ip].y-vs[i].y, bz=vs[ip].z-vs[i].z;
      const cx2=ay*bz-az*by, cy2=az*bx-ax*bz, cz2=ax*by-ay*bx;
      _stA[i]=Math.atan2(Math.hypot(cx2,cy2,cz2), ax*bx+ay*by+az*bz);
    }
    for(let p=0;p<2;p++){
      for(let i=0;i<n;i++) _stB[i]=_stA[i];
      for(let i=0;i<n;i++){ const im=(i-1+n)%n, ip=(i+1)%n;
        _stA[i]=0.25*_stB[im]+0.5*_stB[i]+0.25*_stB[ip]; }
    }
    const rings=seg+1, rowN=RADS+1;
    const col=new Float32Array(rings*rowN*3);
    const cT=new THREE.Color();
    const kNorm=n/(2*Math.PI);             // θ·kNorm = κ/κ₀ (кольцо: θ₀=2π/n)
    // «плотно»/продувка: шкала — доля ФИЗИЧЕСКОГО предела изгиба нити данной
    // толщины (θ·D ≤ 1.9·L0 — гейт роста); упаковка легально гнёт нить у
    // предела её радиуса — это не «перегиб», красным горит только выход к
    // самому пределу. Обычный режим: κ/κ₀ (кольцо), красное с 7×
    const tightSc=bigD()? effD()/(1.9*L0) : 0;
    for(let r=0;r<rings;r++){
      const fi=((r%seg)/seg)*n;            // замкнуто: последнее кольцо = первому
      const i0=Math.floor(fi)%n, i1=(i0+1)%n, fr=fi-Math.floor(fi);
      const th=_stA[i0]*(1-fr)+_stA[i1]*fr;
      const u=tightSc>0? _clamp(th*tightSc, 0, 1) : _clamp((th*kNorm-1)/6, 0, 1);
      cT.setHSL((1-u)/3, 0.8, 0.52).convertSRGBToLinear();

        col[o]=cT.r; col[o+1]=cT.g; col[o+2]=cT.b;

}

    // ДОК ОБРЕЗАЕТ ОКНА (overflow:hidden), а ножницы брались по полному прямоугольнику: окно,
