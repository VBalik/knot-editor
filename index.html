    // Проекция — по полному прямоугольнику (setViewport), рисуем только пересечение с доком и холстом
    const dr=(dockEl && dockEl.getBoundingClientRect()) || cr;
    const sl=Math.max(r.left, dr.left, cr.left), sr=Math.min(r.right, dr.right, cr.right);
    const st=Math.max(r.top, dr.top, cr.top), sb=Math.min(r.bottom, dr.bottom, cr.bottom);
    if(sr-sl<2 || sb-st<2) continue;
    if(!on){ renderer.setScissorTest(true); on=true; }
    const x=r.left-cr.left, y=cr.bottom-r.bottom;
    renderer.setViewport(x,y,r.width,r.height); renderer.setScissor(sl-cr.left, cr.bottom-sb, sr-sl, sb-st);
    const asp=r.width/r.height;
    if(w.fitA && Math.abs(asp-w.fitA)/w.fitA>0.02) msWinFit(w, true);   // раскрыли/свернули окно или сменился размер панели — кадр заново
    w.camera.aspect=asp; w.camera.updateProjectionMatrix(); w.controls.update();
    renderer.render(w.scene, w.camera);
  }
  if(on){ renderer.setScissorTest(false); renderer.setViewport(0,0,cr.width,cr.height); renderer.setScissor(0,0,cr.width,cr.height); }
}

function updateFloor(){
  // пол всегда чуть НИЖЕ самой низкой точки узла → узел никогда не уходит под пол,
  // но и не висит слишком высоко (размер узла в ходе релаксации меняется).
  if(!floor || !verts.length) return;
  let minY=Infinity; for(const v of verts) if(v.y<minY) minY=v.y;
  const y=minY - tubeRadius - 0.35;
  floor.position.y=y;
  if(grid) grid.position.y=y+0.002;
}

function onResize(){
  const r=glCv.parentElement.getBoundingClientRect();
  if(r.width<2||r.height<2) return;
  if(_msMax && _msMax.el){ const dr=document.getElementById('msDock').getBoundingClientRect(); Object.assign(_msMax.el.style,{width:dr.width+'px', height:dr.height+'px'}); }
  renderer.setSize(r.width,r.height);  // updateStyle=true → холст точно по размеру панели
  camera.aspect=r.width/Math.max(1,r.height);
  camera.updateProjectionMatrix();
  fitCamera(true);                     // сохраняем ракурс, держим узел в центре
}

let _fitR=0;   // радиус узла при последнем кадрировании (для автоподгонки в animate)
function fitCamera(keepDir, dirOverride){
  // авто-кадрирование: узел всегда целиком и по центру кадра (с учётом аспекта).
  if(!verts.length) return;
  let c=new THREE.Vector3(); verts.forEach(v=>c.add(v)); c.multiplyScalar(1/N);
  let R=0; verts.forEach(v=>R=Math.max(R,v.distanceTo(c)));
  R=Math.max(R,2);
  _fitR=R;
  const fov=camera.fov*Math.PI/180, aspect=Math.max(0.35,camera.aspect);
  const distV=R/Math.tan(fov/2), distH=R/(Math.tan(fov/2)*aspect);
  const dist=Math.max(distV,distH)*1.25 + R*0.6;
  let dir;
  if(dirOverride) dir=dirOverride.clone();
  else if(keepDir){ dir=camera.position.clone().sub(controls.target);
    if(dir.length()<1e-3) dir.set(0.32,0.30,1); }
  else dir=new THREE.Vector3(0.32,0.30,1);
  dir.normalize().multiplyScalar(dist);
  camera.position.set(dir.x, dir.y, dir.z);
  controls.target.set(0,0,0); controls.update();
}

// показать равновесную форму «анфас»: камера — вдоль нормали к плоскости узла
// (минимальная ось ковариации; для трилистника это ось C3-симметрии) с лёгким
// наклоном, чтобы читались проходы. Иначе честно симметричная розетка выглядит
// «кособокой» из-за косого ракурса и перспективы.
function faceCamera(){
  if(!verts.length) return;
  let xx=0,xy=0,xz=0,yy=0,yz=0,zz=0;
  for(const v of verts){ xx+=v.x*v.x; xy+=v.x*v.y; xz+=v.x*v.z;
    yy+=v.y*v.y; yz+=v.y*v.z; zz+=v.z*v.z; }
  const tr=xx+yy+zz;
  // максимальный собственный вектор (tr·E − C) = минимальный ковариации C
  const a11=tr-xx, a12=-xy, a13=-xz, a22=tr-yy, a23=-yz, a33=tr-zz;
  let nx=0.577,ny=0.577,nz=0.577;
  for(let it=0;it<32;it++){
    const px=a11*nx+a12*ny+a13*nz, py=a12*nx+a22*ny+a23*nz, pz=a13*nx+a23*ny+a33*nz;
    const m=Math.hypot(px,py,pz)||1; nx=px/m; ny=py/m; nz=pz/m;
  }
  // сторона — ближняя к текущей камере, чтобы кадр не «перепрыгивал» за узел
  const cur=camera.position.clone().normalize();
  if(nx*cur.x+ny*cur.y+nz*cur.z<0){ nx=-nx; ny=-ny; nz=-nz; }
  let tx=-ny, ty=nx; const tm=Math.hypot(tx,ty);
  if(tm<1e-6){ tx=1; ty=0; } else { tx/=tm; ty/=tm; }
  fitCamera(false, new THREE.Vector3(nx+0.15*tx, ny+0.15*ty, nz).normalize());
}

let running=false;
/* ============================================================================
   ТЕЛЕМЕТРИЯ — полный лог прогона (runLog): исходная диаграмма и проходы
   над/под, 3D-форма после лифта, метрики каждого кадра, снапшоты формы по
   геометрической сетке шагов, финальная форма. После остановки физики файл
   лог сохраняется тихо: через дев-сервер либо в выбранную папку проекта
   (File System Access); скачивание — только кнопкой «Телем».
   ========================================================================== */
function knotDiagnostics(){
  let cx=0,cy=0,cz=0; for(const v of verts){cx+=v.x;cy+=v.y;cz+=v.z;} cx/=N;cy/=N;cz/=N;
  let maxC=0,sumC=0,energy=0;                       // кривизна и энергия изгиба
  for(let i=0;i<N;i++){ const im=(i-1+N)%N, ip=(i+1)%N;
    const ax=verts[i].x-verts[im].x,ay=verts[i].y-verts[im].y,az=verts[i].z-verts[im].z;
    const bx=verts[ip].x-verts[i].x,by=verts[ip].y-verts[i].y,bz=verts[ip].z-verts[i].z;
    const nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
    const th=Math.atan2(Math.hypot(nx,ny,nz), ax*bx+ay*by+az*bz);
    if(th>maxC)maxC=th; sumC+=th; energy+=th*th; }
  const minSeg=(_teleMin3>=0)? _teleMin3 : _gapScan(3, false);   // мин. зазор между прядями (стягивание); fast: из последнего счёта энергии (relaxStep) либо точный скан по сетке вместо O(N²) (телеметрия звала его каждый шаг)
  if(_teleMin3>=0) _gsPrev=_teleMin3;
  let s=0,s2=0;                                     // разброс радиуса (окружность → 0%)
  for(const v of verts){ const r=Math.hypot(v.x-cx,v.y-cy,v.z-cz); s+=r; s2+=r*r; }
  const mr=s/N, varr=Math.max(0, s2/N-mr*mr);
  const rvar = mr>1e-9 ? 100*Math.sqrt(varr)/mr : 0;
  return {cx,cy,cz, maxCurv:maxC, meanCurv:sumC/N, bendEnergy:energy, minSegL0:minSeg/L0, rvar};
}
function _vertsSnapshot(prec){
  const p=prec||3;
  return verts.map(v=>[+v.x.toFixed(p),+v.y.toFixed(p),+v.z.toFixed(p)]);
}
function pushSnapshot(){
  if(!runLog) return;
  runLog.snapshots.push({st:stepCounter, verts:_vertsSnapshot(3)});
}
// запись метрик шага в серию лога. Вызывается из relaxStep (а не из кадра
// отрисовки): лог полон и в скрытой вкладке, где rAF заморожен.
function recordTelemetry(){
  if(!runLog || !verts.length) return;
  if((++_frameNo)%recordEvery) return;         // прореживание на длинных прогонах
  const d=knotDiagnostics();
  // угловая скорость всего узла (вращение):  ω = |Σ r×v| / Σ|r|²  (за шаг, v из _p*)
  let ox=0,oy=0,oz=0,rr=0;
  for(let i=0;i<N;i++){ const rx=verts[i].x-d.cx,ry=verts[i].y-d.cy,rz=verts[i].z-d.cz;
    const vx=verts[i].x-_px[i],vy=verts[i].y-_py[i],vz=verts[i].z-_pz[i];
    ox+=ry*vz-rz*vy; oy+=rz*vx-rx*vz; oz+=rx*vy-ry*vx; rr+=rx*rx+ry*ry+rz*rz; }
  const omega=rr>1e-9?Math.hypot(ox,oy,oz)/rr:0;
  runLog.series.push({ st:stepCounter, maxMove:+(_dbgMoved/L0).toFixed(5),
    attempt:+(_dbgAttempt/L0).toFixed(4), omega:+omega.toFixed(5),
    minSegL0:+d.minSegL0.toFixed(3), maxCurv:+d.maxCurv.toFixed(3), bendEnergy:+d.bendEnergy.toFixed(2),
    rvar:+d.rvar.toFixed(2), cap:+_capScale.toFixed(3), settle:settleCount,
    drift:+(Math.hypot(d.cx,d.cy,d.cz)/L0).toFixed(4),
    tD:+(effD()/L0).toFixed(2),
    // E — полная потенциальная энергия принятого состояния (монотонный спуск:
    // вне продувки ряд обязан НЕ расти); null — гейт спит, ландшафт движется.
    // kR — макс. кривизна к кривизне кольца той же длины (κ/κ₀; 1 = покой)
    bp: _blowPhase || (_morph?9:0) || (_lastUnkWhole?8:0),
    E: (!_energyDirty && _ePrev>=0)? +_ePrev.toFixed(3) : null,
    kR:+(_maxThPrev*N/(2*Math.PI)).toFixed(2) });
  // история не обрезается, а прореживается: ранние кадры важны для диагностики
  if(runLog.series.length>1600){
    runLog.series=runLog.series.filter((_,i)=>i%2===0);
    recordEvery*=2;
  }
}
function _diagramLog(){
  return { totalLen2D:+totalLen2D.toFixed(1),
    crossings: crossings.map(c=>({x:+c.x.toFixed(1), y:+c.y.toFixed(1),
      sA:+c.sA.toFixed(2), sB:+c.sB.toFixed(2), over:c.over})),
    smooth: smooth.map(p=>[Math.round(p.x),Math.round(p.y)]) };
}
/* Сохранение лога БЕЗ диалогов на каждый стоп:
   1) дев-сервер (serve.py): POST → <проект>/telemetry/… — всегда тихо;
   2) страница открыта с диска: File System Access API — папку проекта
      выбираем ОДИН раз кнопкой «Телем», хэндл запоминается (IndexedDB),
      дальше пишем тихо (в новой сессии браузера первое сохранение снова
      требует клика по «Телем» — разрешение подтверждается один раз);
   3) скачивание в Downloads — ТОЛЬКО явной кнопкой, как последний фолбэк.
   Автосохранение при остановке физики никогда не открывает диалогов:
   если тихо некуда — статус подскажет нажать «Телем». */
let _telemDir=null;
function _idbKV(mode){ return new Promise((res,rej)=>{
  const rq=indexedDB.open('knotTelemetry',1);
  rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
  rq.onsuccess=()=>{ const db=rq.result;
    res(db.transaction('kv',mode).objectStore('kv')); };
  rq.onerror=()=>rej(rq.error);
}); }
function _idbGet(k){ return _idbKV('readonly').then(st=>new Promise((res,rej)=>{
  const rq=st.get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); })); }
function _idbSet(k,v){ return _idbKV('readwrite').then(st=>new Promise((res,rej)=>{
  const rq=st.put(v,k); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); })); }
function _telemName(){
  const d=new Date(), p=(x)=>String(x).padStart(2,'0');
  return 'knot-telemetry-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+
    '-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.json';
}
async function _saveViaFS(json, viaGesture){
  if(typeof showDirectoryPicker!=='function' || typeof indexedDB==='undefined') return null;
  try{
    let dir=_telemDir || await _idbGet('dir').catch(()=>null);
    if(!dir){
      if(!viaGesture) return null;         // диалог можно открыть только по клику
      dir=await showDirectoryPicker({id:'knot-telemetry', mode:'readwrite'});
      await _idbSet('dir', dir).catch(()=>{});
    }
    let perm=await dir.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      if(!viaGesture) return null;
      perm=await dir.requestPermission({mode:'readwrite'});
      if(perm!=='granted') return null;
    }
    _telemDir=dir;
    const name=_telemName();
    const fh=await dir.getFileHandle(name,{create:true});
    const w=await fh.createWritable();
    await w.write(json); await w.close();
    return name+' (project folder)';
  }catch(e){ return null; }
}
function _telemData(){
  return runLog || (verts.length ? {         // физика ещё не запускалась — снимок
    meta:{ when:new Date().toISOString(), build:window.__buildTag, N, L0:+L0.toFixed(5),
      bendCoef, repCoef, isUnknot, knotDet, note:'snapshot without a physics run' },
    diagram:_diagramLog(), lift3d:_vertsSnapshot(4), series:[], snapshots:[], final:null
  } : null);
}
// вернуть подпись места сохранения либо null (тихо некуда).
// viaGesture=true — вызов кнопкой: разрешены диалог выбора папки и скачивание.
const DEV_SRV='http://127.0.0.1:8742/';   // запасной адрес для file://-режима
async function persistTelemetry(viaGesture){
  const data=_telemData();
  if(!data) return null;
  const json=JSON.stringify(data);
  // сначала относительный путь (страница с сервера), затем абсолютный
  // localhost (страница открыта файлом — CORS на сервере разрешён)
  for(const base of ((location.protocol==='http:'||location.protocol==='https:')? ['', DEV_SRV] : [DEV_SRV])){
    try{
      const r=await fetch(base+'save-telemetry',{method:'POST',
        headers:{'Content-Type':'application/json'}, body:json});
      if(r.ok){ const j=await r.json(); return j.saved; }
    }catch(e){}
  }
  const viaFS=await _saveViaFS(json, viaGesture);
  if(viaFS) return viaFS;
  if(viaGesture){
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download='knot-telemetry.json'; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return 'downloaded to Downloads';
  }
  return null;
}
function exportTelemetry(){
  if(!_telemData()){ showError('build a knot first'); return; }
  persistTelemetry(true).then(saved=>{
    if(saved) setStatus('telemetry: '+saved+' → send the file');
  });
}

const STEP_BUDGET_MS=12;   // бюджет физики на кадр: сколько шагов успеет (1–8)
function animate(){
  requestAnimationFrame(animate);
  if(_stir && verts.length){                       // разрыхление (Stir): несколько шагов в кадр
    const t0=performance.now();
    for(let k=0; _stir && k<6 && (k===0 || performance.now()-t0<STEP_BUDGET_MS); k++) stirStep();
    rebuildTube();
    let R=0; for(const v of verts){ const d=v.length(); if(d>R) R=d; }
    if(_fitR>0 && Math.abs(R-_fitR)/_fitR>0.06) fitCamera(true);
    if(_stir) setStatus(stirStatus());
  }
  if(_par){ parRender(); setStatus(runStatus()); }
  if(running && !_par && verts.length){
    const t0=performance.now();
    for(let k=0; running && k<8 && (k===0 || performance.now()-t0<STEP_BUDGET_MS); k++)
      relaxStep();                                   // телеметрию пишет сам relaxStep
    rebuildTube();
    // узел в ходе релаксации меняет размер — держим его целиком в кадре
    let R=0; for(const v of verts){ const d=v.length(); if(d>R) R=d; }
    if(_fitR>0 && Math.abs(R-_fitR)/_fitR>0.06) fitCamera(true);
    if(running) setStatus(runStatus());   // relaxStep мог объявить равновесие
  }
  controls.target.set(0,0,0);          // центр вращения фиксирован в начале координат
  controls.update();
  renderer.render(scene,camera);
  msRender();                          // окна результатов попыток поверх главного вида
}

let physEverRun=false;
function applyStretch(lo, sp){   // случайное аффинное растяжение (диагональ lo…lo+sp в случайном базисе), длина нити возвращается к N·L0
    let ax=[Math.random()-0.5,Math.random()-0.5,Math.random()-0.5]; const al=Math.hypot(ax[0],ax[1],ax[2])||1; ax=ax.map(x=>x/al);
    const th=Math.random()*Math.PI, c=Math.cos(th), sn=Math.sin(th), mc=1-c;
    const Rm=[[c+ax[0]*ax[0]*mc, ax[0]*ax[1]*mc-ax[2]*sn, ax[0]*ax[2]*mc+ax[1]*sn],[ax[1]*ax[0]*mc+ax[2]*sn, c+ax[1]*ax[1]*mc, ax[1]*ax[2]*mc-ax[0]*sn],[ax[2]*ax[0]*mc-ax[1]*sn, ax[2]*ax[1]*mc+ax[0]*sn, c+ax[2]*ax[2]*mc]];
    const sc=[lo+sp*Math.random(), lo+sp*Math.random(), lo+sp*Math.random()];
    let cx=0,cy=0,cz=0; for(const v of verts){cx+=v.x;cy+=v.y;cz+=v.z;} cx/=N;cy/=N;cz/=N;
    for(const v of verts){ const p=[v.x-cx,v.y-cy,v.z-cz];
      const q=[Rm[0][0]*p[0]+Rm[1][0]*p[1]+Rm[2][0]*p[2], Rm[0][1]*p[0]+Rm[1][1]*p[1]+Rm[2][1]*p[2], Rm[0][2]*p[0]+Rm[1][2]*p[1]+Rm[2][2]*p[2]];   // Rᵀp
      q[0]*=sc[0]; q[1]*=sc[1]; q[2]*=sc[2];
      v.x=cx+Rm[0][0]*q[0]+Rm[0][1]*q[1]+Rm[0][2]*q[2]; v.y=cy+Rm[1][0]*q[0]+Rm[1][1]*q[1]+Rm[1][2]*q[2]; v.z=cz+Rm[2][0]*q[0]+Rm[2][1]*q[1]+Rm[2][2]*q[2]; }
    // длина нити — физическая константа: вернуть суммарную длину к N·L0 равномерным масштабом
    { let tl=0; for(let i=0;i<N;i++) tl+=verts[i].distanceTo(verts[(i+1)%N]); const f=(N*L0)/Math.max(tl,1e-12);
      for(const v of verts){ v.x=cx+(v.x-cx)*f; v.y=cy+(v.y-cy)*f; v.z=cz+(v.z-cz)*f; } }
}

/* ---- ПАРАЛЛЕЛЬНЫЕ ПОПЫТКИ (2.11): каждая попытка серии считается в своём Web Worker —
   безголовой копии этой же страницы (заглушки DOM как в стенде test/harness.js, THREE из CDN).
   Главный поток раздаёт попытки пулу воркеров (ядер−1, ≤8), показывает лучшую из идущих в 3D,
   по завершении каждой добавляет окно результата, в конце выбирает минимум. Пауза = отмена
   серии (лучший результат остаётся), ползунок во время серии = перезапуск, новая диаграмма и

let _par=null, _parBlobURL=null, _parWasm=[];   // _parWasm[k] — счётчики Wasm-ядра воркера k из его 'done' (3.2)

function _workerSource(){

    toggle:(x,f)=>{ if(f===undefined) f=!s.has(x); if(f) s.add(x); else s.delete(x); return f; }, contains:x=>s.has(x)}; }
  function makeEl(id){ const L={}; const el={id, value:'', textContent:'', innerHTML:'', checked:false, disabled:false, width:800, height:600,
    clientWidth:800, clientHeight:600, offsetWidth:0, style:{}, dataset:{}, attrs:{}, classList:makeClassList(), onclick:null, oninput:null, onchange:null,
